/* ---------- npc scripts ---------- */
function runNpcScript(d){
  switch(d.script){
    case "heal":
      say(["Nurse: Welcome to the Pokémon Center!","Nurse: Shall I restore your Pokémon to full health?"],()=>{
        ask("Heal your Pokémon?",["Yes","No"],i=>{
          if(i===0){
            healAllParty(); sfx("heal");
            G.pl.lastHeal={map:G.pl.map,x:G.pl.x,y:G.pl.y};
            autosave();
            say(["Nurse: ...... ...... ♪","Nurse: All healed! We hope to see you again!"]);
          }
        },1);
      });
      break;
    case "shop":
      say("Clerk: Welcome! What can I get you?",()=>G.push(new MartScene(d.stock)));
      break;
    case "pc":
      sfx("confirm");
      say("You booted up the PC. Pokémon Storage System online.",()=>G.push(new PCScene()));
      break;
    case "starter":
      if(!flag("starter")){
        say(["Maple: Ah! You must be the new Trainer from next door!","Maple: I'm Professor Maple. I study Pokémon and weather patterns.","Maple: Lately the weather's been... restless. I need capable Trainers out in the field.","Maple: Choose one of these three Pokémon. They're all dear to me — treat them well!"],()=>{
          pickStarter();
        });
      } else if(flag("badge1")&&!flag("gotGauntlet2")){
        say(["Maple: The Granite Badge already? Splendid!","Maple: Team Ember was spotted in Granite Tunnel east of Slatecliff.","Maple: They babble about 'waking the sky serpent in rage'. Madness!","Maple: Be careful out there."]);
      } else {
        say(["Maple: How's your journey? Remember:","Maple: rain empowers Water moves, harsh sun empowers Fire.","Maple: Even legends bow to the weather... or command it."]);
      }
      break;
    case "gauntlet":
      if(flag("badge1")&&!flag("gotGauntlet")){
        setFlag("gotGauntlet");
        G.pl.bag.powergauntlet=1;
        sfx("badge");
        say(["Scientist: You beat Petra? Then you've earned this prototype.","You received the POWER GAUNTLET!","Scientist: Squeeze a scrappy tree and pop — it's gone. No HM slave required!","Scientist: The path east through Route 110 is yours now."]);
      } else if(!flag("badge1")){
        say(["Scientist: I built a gadget for clearing brush, but I only trust Badge holders.","Scientist: Beat Petra at the Gym and we'll talk."]);
      } else {
        say("Scientist: How's the Gauntlet? Crushing it? Ha!");
      }
      break;
    case "elder":
      if(flag("caveg1")&&flag("caveg2")&&!flag("gotAmulet")){
        setFlag("gotAmulet");
        G.pl.bag.tideamulet=1;
        sfx("badge");
        say(["Elder: You drove those Ember hooligans from the tunnel. The mountain thanks you.","Elder: Take this heirloom — the TIDE AMULET.","You received the TIDE AMULET!","Elder: With it you may ride the waves themselves. No need for hidden machines.","Elder: South of Slatecliff, Route 134 crosses the bay to Marinport City.","Elder: I fear Team Ember is already there..."]);
      } else if(!flag("caveg1")||!flag("caveg2")){
        say(["Elder: Ember ruffians stomp through Granite Tunnel, scaring the Pokémon.","Elder: If only someone would teach BOTH of them a lesson..."]);
      } else {
        say(["Elder: The sea obeys the amulet, and the sky obeys the Serpent.","Elder: May both be kind to you, child."]);
      }
      break;
    case "rayquaza":
      if(flag("rayCaught")) return;
      say(["The air pressure drops. Your ears pop.","RAYQUAZA descends from the stratosphere, coils crackling with ancient power!"],()=>{
        startStaticBattle(37,50,{
          onWin:res=>{
            if(res==="won") say(["Rayquaza soars back into the stratosphere...","The sky feels calm. Perhaps it will return one day."]);
            if(res==="caught") say(["The Sky Serpent acknowledges you as its rider.","You caught RAYQUAZA — guardian of the weather itself!"]);
          }
        });
      });
      break;
  }
}
function pickStarter(){
  ask("Which Pokémon will you choose?",["Sproutle (Grass)","Embercub (Fire)","Aquafin (Water)"],i=>{
    const sp=STARTERS[i];
    say(["You chose "+SPECIES[sp].name+"!","Maple: A fine choice! Your neighbor Rex took one too — the one strong against yours, the cheeky lad.","Maple: Here, take these Poké Balls and Potions as well. Now go — Route 101 awaits!"],()=>{
      const m=makeMon(sp,5,{ivs:[20+(Math.random()*12|0),20+(Math.random()*12|0),20+(Math.random()*12|0),20+(Math.random()*12|0),20+(Math.random()*12|0),20+(Math.random()*12|0)]});
      G.pl.party.push(m);
      G.pl.bag.pokeball=(G.pl.bag.pokeball||0)+5;
      G.pl.bag.potion=(G.pl.bag.potion||0)+3;
      G.pl.flags.starterId=sp;
      setFlag("starter");
      G.pl.seen[sp]=true;
      G.pl.lastHeal={map:"verdant",x:9,y:14};
      autosave();
    });
  });
}

class SlotScene {
  constructor(){ this.idx=0; }
  update(){
    if(Input.p("U")){ this.idx=(this.idx+2)%3; sfx("blip"); }
    if(Input.p("D")){ this.idx=(this.idx+1)%3; sfx("blip"); }
    if(Input.p("B")){ sfx("cancel"); G.replace(new TitleScene()); return; }
    if(Input.p("A")){
      sfx("confirm");
      const slot=this.idx;
      const info=loadSlotInfo(slot);
      if(info){
        ask("Slot "+(slot+1)+": what would you like to do?",["Continue","New Game","Cancel"],i=>{
          if(i===0){ startGame(slot, info.pl); }
          if(i===1){ ask("Overwrite this save with a new game?",["Yes","No"],j=>{ if(j===0) startGame(slot,null); },1); }
        },2);
      } else startGame(slot,null);
    }
  }
  draw(){
    ctx.fillStyle="#10303c"; ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    drawText("SELECT A SAVE SLOT",60,12,"#aee8c8",9,"#06281a");
    for(let s=0;s<3;s++){
      const y=32+s*38;
      panel(20,y,200,34,{bg:s===this.idx?"#fdf3d0":"#f8f8f0"});
      if(s===this.idx) drawText("▶",26,y+12,"#c03028");
      const info=loadSlotInfo(s);
      if(info&&info.pl){
        const p=info.pl;
        drawText("SLOT "+(s+1)+" — "+p.name,38,y+5);
        const badges=(p.flags.badge1?1:0)+(p.flags.badge2?1:0);
        drawText("Badges:"+badges+"  Party:"+p.party.length+"  $"+p.money,38,y+16,"#506070",7);
        drawText(MAPS[p.map]?MAPS[p.map].name:"",38,y+24,"#888",7);
      } else {
        drawText("SLOT "+(s+1)+" — NEW GAME",38,y+12,"#888");
      }
    }
  }
}

function startGame(slot, savedPl){
  G.slot=slot;
  if(savedPl){
    G.pl=savedPl;
    // re-link defaults for forward compat
    G.pl.options=Object.assign({expShare:true,crt:false,sound:true},G.pl.options);
    document.body.classList.toggle("crt",!!G.pl.options.crt);
    AudioSys.enabled=G.pl.options.sound;
    G.scenes.length=0;
    G.world=new World();
    G.push(G.world);
  } else {
    G.pl=G.newPlayer();
    G.scenes.length=0;
    G.world=new World();
    G.push(G.world);
    say(["Welcome to the world of Pokémon — and to the Emerald Bay region!",
      "I'm Professor Maple. Out here, weather isn't just small talk: rain, sun and storms can turn any battle.",
      "Your own story starts today, in little Verdant Town.",
      "Step outside, come to my lab, and pick your very first partner!",
      "(Tip: open the menu with START/Enter. Your game autosaves at key moments.)"]);
  }
}

/* ============================== MAIN LOOP ============================== */
let _last=0, _acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!_last) _last=ts;
  let dt=ts-_last; _last=ts;
  if(dt>200) dt=200;
  _acc+=dt;
  const STEP=1000/60;
  let stepped=false;
  while(_acc>=STEP){
    _acc-=STEP;
    G.frame++;
    const top=G.top();
    if(top){ top.update(); }
    Input.flush();
    stepped=true;
  }
  if(stepped){
    ctx.clearRect(0,0,SCREEN_W,SCREEN_H);
    for(const s of G.scenes){ if(s.draw) s.draw(); }
  }
}

function boot(){
  buildTileAtlas();
  Input.init();
  // scale canvas to fit window (integer-ish scaling)
  function fit(){
    const availW=innerWidth-40, availH=innerHeight-80;
    let scale=Math.max(1,Math.min(availW/SCREEN_W, availH/SCREEN_H));
    if(scale>2) scale=Math.floor(scale);
    canvas.style.width=(SCREEN_W*scale)+"px";
    canvas.style.height=(SCREEN_H*scale)+"px";
  }
  addEventListener("resize",fit); fit();
  if(navigator.maxTouchPoints>0) document.body.classList.add("touch");
  G.push(new TitleScene());
  requestAnimationFrame(frame);
}
