<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pokémon Emerald Quest</title>
<style>
  :root{
    --shell:#1a3a2a;
    --bezel:#0c1f15;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%, #234d36 0%, #122b1d 60%, #0a1a11 100%);
    font-family:'Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #frame{position:relative;background:var(--bezel);padding:10px;border-radius:12px;
    box-shadow:0 0 0 4px #2c5c40, 0 18px 50px rgba(0,0,0,.7), inset 0 0 18px rgba(0,0,0,.8);}
  #screen{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:3px;}
  #crt{position:absolute;inset:10px;pointer-events:none;border-radius:3px;display:none;}
  body.crt #crt{display:block;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, rgba(120,255,170,0.05) 0%, rgba(0,0,0,0.28) 100%);
    mix-blend-mode:multiply;}
  body.crt #screen{filter:saturate(1.15) contrast(1.06) brightness(1.03);}
  #title-led{position:absolute;top:14px;left:18px;width:8px;height:8px;border-radius:50%;
    background:#46ff8a;box-shadow:0 0 8px #46ff8a;}
  /* ---- touch controls ---- */
  #touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:30;}
  body.touch #touch{display:block;}
  .tbtn{position:absolute;pointer-events:auto;background:rgba(20,50,35,.75);border:2px solid rgba(140,255,190,.45);
    color:#cfffe2;display:flex;align-items:center;justify-content:center;font-weight:bold;
    font-family:'Courier New',monospace;border-radius:10px;
    box-shadow:0 3px 0 rgba(0,0,0,.5);}
  .tbtn:active,.tbtn.held{background:rgba(90,200,140,.85);color:#06140c;}
  #dpad{position:absolute;left:18px;bottom:24px;width:150px;height:150px;pointer-events:none;}
  #dpad .tbtn{width:50px;height:50px;font-size:20px;}
  #d-up{left:50px;top:0;}  #d-down{left:50px;top:100px;}
  #d-left{left:0;top:50px;} #d-right{left:100px;top:50px;}
  #b-a{right:22px;bottom:96px;width:62px;height:62px;border-radius:50%;font-size:22px;}
  #b-b{right:96px;bottom:40px;width:62px;height:62px;border-radius:50%;font-size:22px;}
  #b-start{right:40px;bottom:14px;width:74px;height:26px;font-size:11px;border-radius:13px;}
  #note{color:#5e9c78;font-size:11px;margin-top:10px;text-align:center;line-height:1.5;font-family:'Courier New',monospace;}
  @media (max-height:520px){ #note{display:none} }
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <div id="title-led"></div>
    <canvas id="screen" width="240" height="160"></canvas>
    <div id="crt"></div>
  </div>
  <div id="note">Arrows/WASD move · Z/Space = A · X/Esc = B · Shift/B = run · Enter = menu · F = battle speed ×2</div>
</div>
<div id="touch">
  <div id="dpad">
    <div class="tbtn" id="d-up">▲</div><div class="tbtn" id="d-down">▼</div>
    <div class="tbtn" id="d-left">◀</div><div class="tbtn" id="d-right">▶</div>
  </div>
  <div class="tbtn" id="b-a">A</div>
  <div class="tbtn" id="b-b">B</div>
  <div class="tbtn" id="b-start">START</div>
</div>

/* shop stock helper used by engine */
const TOWN_OF = {center_slate:"slatecliff",mart_slate:"slatecliff"};
/* ============================== GFX ============================== */
const TS = 16; // tile size
function mkCanvas(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shade(hex, f){ // f<1 darker, >1 lighter
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.min(255,Math.round(r*f)); g=Math.min(255,Math.round(g*f)); b=Math.min(255,Math.round(b*f));
  return `rgb(${r},${g},${b})`;
}

/* ---------- tile atlas (2 animation frames) ---------- */
const TILE_CODES = ["T","t",".","g","G","f","W","R","S","C",",","#","_","c","=","^"];
const tileAtlas = {frames:[null,null], index:{}};
function buildTileAtlas(){
  TILE_CODES.forEach((c,i)=>tileAtlas.index[c]=i);
  for(let f=0; f<2; f++){
    const cv = mkCanvas(TS*TILE_CODES.length, TS), g = cv.getContext("2d");
    TILE_CODES.forEach((code,i)=>drawTileInto(g, i*TS, 0, code, f));
    tileAtlas.frames[f]=cv;
  }
}
function speckle(g,x,y,seed,color,n){ const r=mulberry32(seed);
  g.fillStyle=color; for(let i=0;i<n;i++) g.fillRect(x+(r()*15|0), y+(r()*15|0), 1, 1); }
function drawTileInto(g,x,y,code,f){

const charCache = {};
function getCharSprite(kind, dir, frame){
  const key = kind+dir+frame;
  if(charCache[key]) return charCache[key];
  const cv = mkCanvas(16,20), g = cv.getContext("2d");
  if(kind==="sign"){ g.fillStyle="#6a4a2a"; g.fillRect(7,10,2,8); g.fillStyle="#a8804a";
    g.fillRect(2,3,12,8); g.fillStyle="#c8a06a"; g.fillRect(3,4,10,6); g.fillStyle="#6a4a2a";
    g.fillRect(4,6,8,1); g.fillRect(4,8,6,1); charCache[key]=cv; return cv; }
  if(kind==="pc"){ g.fillStyle="#888890"; g.fillRect(3,4,10,9); g.fillStyle="#58c8e8";
    g.fillRect(4,5,8,6); g.fillStyle="#404048"; g.fillRect(5,13,6,3); g.fillStyle="#a8f8a8"; g.fillRect(5,6,3,2);
    charCache[key]=cv; return cv; }
  if(kind==="rayquaza"){ const m = getMonSprite(37,false); g.imageSmoothingEnabled=false;
    g.drawImage(m,0,0,m.width,m.height,0,2,16,16); charCache[key]=cv; return cv; }
  const p = CHAR_PALS[kind]||CHAR_PALS.boy;
  const flip = dir==="L";
  const d = dir==="L"||dir==="R" ? "S" : dir; // side
  if(flip){ g.translate(16,0); g.scale(-1,1); }
  const step = frame===1;

  else { g.fillRect(5,15,3,4-(step?1:0)); g.fillRect(9,15,3,4-(step?0:1)); }
  g.fillStyle="#282828"; // shoes
  if(d==="S"){ g.fillRect(6,18-legA,3,1+legA); g.fillRect(9,18,3,1); }
  else { g.fillRect(5,18-(step?1:0),3,1+(step?1:0)); g.fillRect(9,18,3,1); }
  // body
  g.fillStyle=p.shirt; g.fillRect(4,10,8,5);
  if(d==="S") { g.fillRect(5,10,7,5); }
  // arms
  g.fillStyle=p.shirt; g.fillRect(3,10,2,4); g.fillRect(11,10,2,4);
  g.fillStyle=p.skin; g.fillRect(3,13,2,2); g.fillRect(11,13,2,2);
  // head
  g.fillStyle=p.skin; g.fillRect(4,3,8,7);
  // hair
  g.fillStyle=p.hair;
  if(d==="U"){ g.fillRect(4,3,8,6); }
  else if(d==="D"){ g.fillRect(4,2,8,3); g.fillRect(3,3,2,4); g.fillRect(11,3,2,4); }
  else { g.fillRect(4,2,8,3); g.fillRect(9,3,3,5); g.fillRect(3,3,2,4); }
  // face
  if(d==="D"){ g.fillStyle="#202020"; g.fillRect(6,6,1,2); g.fillRect(9,6,1,2); }
  else if(d==="S"){ g.fillStyle="#202020"; g.fillRect(6,6,1,2); }
  // hat
  if(p.hat){ g.fillStyle=p.hat; g.fillRect(3,2,10,3); g.fillRect(4,1,8,2);
    if(p.hatBand){ g.fillStyle=p.hatBand; g.fillRect(3,4,10,1); } if(d==="D"&&kind==="player"){g.fillStyle=p.hatBand;g.fillRect(7,2,2,2);} }
  if(kind==="prof"||kind==="sci"){ g.fillStyle="#f8f8f0"; g.fillRect(3,10,2,6); g.fillRect(11,10,2,6); }
  charCache[key]=cv; return cv;
}

/* ---------- monster sprite generator ---------- */
const monCache = {};
function getMonSprite(id, back){
  const key = id+(back?"b":"f");
  if(monCache[key]) return monCache[key];
  const cv = mkCanvas(64,64), g = cv.getContext("2d");
  const S = SPECIES[id], gp = S.g, rnd = mulberry32(id*7919+3);
  const px = (x,y,c)=>{ g.fillStyle=c; g.fillRect(x*2|0,y*2|0,2,2); };
  const ell = (cx,cy,rx,ry,c,oc)=>{
    for(let y=Math.ceil(cy-ry);y<=cy+ry;y++) for(let x=Math.ceil(cx-rx);x<=cx+rx;x++){
      const dx=(x-cx)/rx, dy=(y-cy)/ry, d=dx*dx+dy*dy;
      if(d<=1){ px(x,y, d>0.62?(oc||shade(typeof c==="string"?c:"#888", .6)):c); }
    }
  };
  const ellF = (cx,cy,rx,ry,c)=>{ for(let y=Math.ceil(cy-ry);y<=cy+ry;y++) for(let x=Math.ceil(cx-rx);x<=cx+rx;x++){
      const dx=(x-cx)/rx, dy=(y-cy)/ry; if(dx*dx+dy*dy<=1) px(x,y,c); } };
  const tri = (x0,y0,x1,y1,x2,y2,c)=>{ // crude triangle
    const minx=Math.min(x0,x1,x2),maxx=Math.max(x0,x1,x2),miny=Math.min(y0,y1,y2),maxy=Math.max(y0,y1,y2);
    for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){
      const b0=(x1-x0)*(y-y0)-(y1-y0)*(x-x0), b1=(x2-x1)*(y-y1)-(y2-y1)*(x-x1), b2=(x0-x2)*(y-y2)-(y0-y2)*(x-x2);
      if((b0>=0&&b1>=0&&b2>=0)||(b0<=0&&b1<=0&&b2<=0)) px(x,y,c);
    } };
  const sz = gp.size||1, c1=gp.c1, c2=gp.c2, c3=gp.c3;
  const eye = (x,y,angry)=>{ px(x,y,"#fff"); px(x+0.0,y,"#fff"); px(x,y,"#fff"); px(x,y, "#fff");
    g.fillStyle="#fff"; g.fillRect(x*2-1,y*2-1,4,4); g.fillStyle="#101010"; g.fillRect(x*2+(back?0:1),y*2+1,2,2);
    if(angry){ g.fillStyle=c2; g.fillRect(x*2-2,y*2-2,5,2);} };
  const G2 = 32; // logical grid 32x32
  switch(gp.body){
    case "blob": {
      const r = 8*sz+2;
      ell(16,19,r,r*0.85,c1,c2);
      ellF(16,22,r*0.6,r*0.45,c3);
      if(gp.spikes) for(let i=0;i<3+gp.spikes;i++){ const a=-Math.PI*(0.15+0.7*i/(2+gp.spikes));
        const bx=16+Math.cos(a)*r, by=19+Math.sin(a)*r*0.85;
        tri(bx-1.5,by+1,bx+1.5,by+1,bx+Math.cos(a)*3,by+Math.sin(a)*3-1,c2); }
      if(gp.leaf){ tri(14,19-r*0.8,18,19-r*0.8,16,19-r*0.8-5,"#3d8a2d"); px(16,19-r*0.8,"#2e6b22"); }
      if(gp.ears){ tri(10,13,14,11,11,6,c1); tri(22,11,18,13,21,6,c1); }
      if(gp.fins){ tri(16-r-2,17,16-r+2,15,16-r-1,11,c3); }
      if(gp.flame){ ellF(16,19-r*0.85-2,3,3,"#f8a030"); ellF(16,19-r*0.85-3,1.5,2,"#f8e048"); }
      eye(12,16); eye(20,16);
      g.fillStyle="#481818"; g.fillRect(30,40,4,2);
      break; }
    case "quad": {
      const bl=8*sz+1;
      ell(18,21,bl,bl*0.62,c1,c2);                 // body
      // legs
      g.fillStyle=c2; for(const lx of [12,16,21,25]) g.fillRect(lx*2,46,4,8);
      g.fillStyle=c1; for(const lx of [12,16,21,25]) g.fillRect(lx*2,44,4,8);
      ell(10,13,5.5*Math.min(sz,1.1)+1,5*Math.min(sz,1.1)+1,c1,c2); // head
      ellF(18,24,bl*0.55,bl*0.3,c3);               // belly
      if(gp.stripes){ g.fillStyle=c2; for(let i=0;i<3;i++) g.fillRect((16+i*5)*2,36,2,8); }
      if(gp.ears){ tri(6,9,9,7,5,2,c1); tri(12,7,15,9,14,2,c1);
        if(gp.ears>1){ tri(7,8,8,7,6,4,c3); tri(13,7,14,8,13,4,c3); } }
      if(gp.horn) tri(13,7,16,8,17,3,c3);
      if(gp.leaf){ tri(8,7,13,7,10,1,"#3d8a2d"); g.fillStyle="#2e6b22"; g.fillRect(20,14,2,4); }
      if(gp.tail){ const ty=gp.tail>1?12:15; ell(28,ty,2.5,2,gp.bolt?c3:c1,c2);
        if(gp.flame){ ellF(28,ty-3,2.5,2.5,"#f8a030"); ellF(28,ty-4,1.2,1.5,"#f8e048"); } }
      if(gp.bolt){ g.fillStyle=c2; g.fillRect(22,38,4,2); g.fillRect(24,40,4,2); g.fillRect(20,36,4,2); }
      if(gp.mane){ ell(10,13,7,6.5,"#f8a030","#c05010"); ell(10,13,5,4.5,c1,c2); }
      eye(8,12,id===23); eye(13,12,id===23);
      g.fillStyle="#481818"; g.fillRect(16,30,4,2);
      break; }
    case "biped": {
      ell(16,10,5.5*sz+0.5,5*sz+0.5,c1,c2);   // head
      ell(16,22,6.5*sz,6*sz,c1,c2);           // torso
      ellF(16,25,4*sz,3*sz,c3);               // belly
      g.fillStyle=c2; g.fillRect(20,52,6,6); g.fillRect(38,52,6,6); // feet
      ell(8,21,2.5,4.5,c1,c2); ell(24,21,2.5,4.5,c1,c2);            // arms
      if(gp.mane){ ell(16,10,7.5,7,"#f8a030","#c05010"); ell(16,10,5,4.5,c1,c2); }
      if(gp.ears){ tri(11,6,14,4,11,0,c1); tri(18,4,21,6,21,0,c1); }
      if(gp.horn) tri(14,4,18,4,16,0,c3);
      if(gp.leaf){ ellF(16,3,4,2,"#3d8a2d"); tri(14,3,18,3,16,-2,"#e060a0"); }
      if(gp.spikes){ tri(9,16,12,14,8,10,c2); tri(20,14,23,16,24,10,c2); }
      if(gp.flame){ ellF(16,1,3,2.5,"#f8a030"); ellF(16,0,1.5,1.5,"#f8e048"); }
      if(gp.tail){ ell(26,27,3,2,c1,c2); }
      eye(13,9,id===33||id===25); eye(19,9,id===33||id===25);

    case "bird": {
      ell(16,20,6*sz+1,7*sz+1,c1,c2);        // body
      ellF(16,24,4*sz,3.5*sz,c3);            // breast
      ell(16,9,5*Math.min(sz,1)+1,4.5*Math.min(sz,1)+1,c1,c2); // head
      if(gp.wings){ ell(7,19,3,6,c2,shade(c2,.7)); ell(25,19,3,6,c2,shade(c2,.7)); }
      tri(14,11,18,11,16,15,"#f0a030");      // beak
      g.fillStyle="#f0a030"; g.fillRect(26,56,4,4); g.fillRect(34,56,4,4); // feet
      if(gp.horn) tri(13,4,16,5,11,1,c2);
      eye(13,8); eye(19,8);
      break; }
    case "fish": {
      ell(14,18,9*sz,6*sz,c1,c2);            // body
      ellF(13,21,6*sz,3*sz,c3);
      tri(23,18,29,12,29,24,c2);             // tail fin
      if(gp.fins){ tri(12,12,17,12,14,6,c3); tri(10,24,15,24,12,29,c3); }
      if(gp.fins>2){ tri(18,11,22,12,21,6,c3); }
      if(gp.horn) tri(8,11,11,10,7,5,c3);
      eye(9,16); g.fillStyle="#481818"; g.fillRect(10,40,4,2);
      break; }
    case "serpent": {
      const segs = id===37 ? [[7,26,4],[12,23,4.2],[17,20,4.4],[21,15,4.2],[23,9,4]]
                           : [[9,25,3.5*sz+1],[14,22,3.6*sz+1],[18,18,3.4*sz+1],[21,13,3.2*sz+1]];
      segs.forEach((s,i)=>{ ell(s[0],s[1],s[2],s[2]*0.9,c1,c2);
        if(gp.rings&&i<segs.length-1){ ellF(s[0],s[1],s[2]*0.55,s[2]*0.5,c3); } });
      const h = segs[segs.length-1];
      ell(h[0],h[1]-2,h[2]+1,h[2],c1,c2);    // head
      if(id===37){ // Rayquaza details
        tri(h[0]-5,h[1]-4,h[0]-2,h[1]-6,h[0]-7,h[1]-9,c1); tri(h[0]+2,h[1]-6,h[0]+5,h[1]-4,h[0]+7,h[1]-9,c1);

      ell(16,11,3,3,c1,c2);                                               // head
      if(gp.ears){ tri(13,9,15,8,12,4,c1); tri(17,8,19,9,20,4,c1); }      // bat ears

  if(back){ // back view: flip + slight darken
    const b = mkCanvas(64,64), bg = b.getContext("2d");
    bg.translate(64,0); bg.scale(-1,1); bg.drawImage(cv,0,0);
    bg.globalCompositeOperation="source-atop"; bg.fillStyle="rgba(20,10,30,0.18)"; bg.fillRect(0,0,64,64);
    monCache[key]=b; return b;
  }
  monCache[key]=cv; return cv;
}

/* ---------- audio ---------- */
const AudioSys = {
  ctx:null, enabled:true,
  ac(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return this.ctx; },
  tone(freq, dur, type="square", vol=0.06, when=0, slide=0){
    if(!this.enabled) return; const ac=this.ac(); if(!ac) return;
    const t0 = ac.currentTime + when;
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t0+dur);
    gn.gain.setValueAtTime(vol,t0); gn.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(gn); gn.connect(ac.destination); o.start(t0); o.stop(t0+dur+0.02);
  },
  noise(dur, vol=0.05, when=0){
    if(!this.enabled) return; const ac=this.ac(); if(!ac) return;
    const t0=ac.currentTime+when, n=ac.sampleRate*dur|0, buf=ac.createBuffer(1,n,ac.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource(); s.buffer=buf; const gn=ac.createGain(); gn.gain.value=vol;
    s.connect(gn); gn.connect(ac.destination); s.start(t0);
  },
};
function sfx(name){
  const A=AudioSys;
  switch(name){
    case "blip": A.tone(880,.04,"square",.04); break;
    case "confirm": A.tone(660,.05); A.tone(990,.07,"square",.05,.05); break;
    case "cancel": A.tone(440,.06,"square",.04,0,-100); break;
    case "bump": A.tone(120,.06,"square",.05); break;
    case "hit": A.noise(.12,.07); A.tone(220,.08,"square",.05,0,-80); break;
    case "superhit": A.noise(.2,.1); A.tone(160,.16,"sawtooth",.08,0,-90); break;
    case "weakhit": A.tone(300,.06,"square",.03); break;
    case "faint": A.tone(440,.3,"sawtooth",.06,0,-380); break;
    case "ball": A.tone(520,.05); A.tone(380,.06,"square",.05,.07); break;
    case "shake": A.tone(240,.05,"square",.05); break;
    case "catch": [523,659,784,1047].forEach((f,i)=>A.tone(f,.12,"square",.05,i*.1)); break;
    case "flee": A.tone(700,.2,"square",.04,0,400); break;
    case "heal": [659,784,988,1319].forEach((f,i)=>A.tone(f,.1,"triangle",.06,i*.08)); break;
    case "levelup": [523,659,784,1047,1319].forEach((f,i)=>A.tone(f,.09,"square",.05,i*.06)); break;
    case "save": A.tone(784,.08); A.tone(1047,.14,"square",.05,.09); break;
    case "encounter": [392,370,392,370,392,440].forEach((f,i)=>A.tone(f,.07,"sawtooth",.05,i*.05)); break;
    case "badge": [523,523,784,784,1047,1319].forEach((f,i)=>A.tone(f,.12,"square",.06,i*.09)); break;
    case "evolve": [440,554,659,880,1109].forEach((f,i)=>A.tone(f,.1,"triangle",.06,i*.09)); break;
    case "thunder": A.noise(.3,.1); break;
  }
}

/* ---------- input ---------- */
const Input = {
  down:{}, pressed:{},
  map(e){
    switch(e.code){
      case "ArrowUp": case "KeyW": return "U";
      case "ArrowDown": case "KeyS": return "D";
      case "ArrowLeft": case "KeyA": return "L";
      case "ArrowRight": case "KeyD": return "R";
      case "KeyZ": case "Space": return "A";
      case "KeyX": case "Escape": return "B";
      case "Enter": return "START";
      case "ShiftLeft": case "ShiftRight": return "RUN";
      case "KeyF": return "FF";
    }
    return null;
  },
  init(){
    addEventListener("keydown",e=>{
      const k=this.map(e); if(!k) return; e.preventDefault();
      if(!this.down[k]) this.pressed[k]=true;
      this.down[k]=true;
      AudioSys.ac();
    });
    addEventListener("keyup",e=>{ const k=this.map(e); if(k) this.down[k]=false; });
    // touch
    const bind=(id,k)=>{
      const el=document.getElementById(id); if(!el) return;
      const on=ev=>{ ev.preventDefault(); if(!this.down[k]) this.pressed[k]=true; this.down[k]=true; el.classList.add("held"); AudioSys.ac(); };
      const off=ev=>{ ev.preventDefault(); this.down[k]=false; el.classList.remove("held"); };
      el.addEventListener("touchstart",on,{passive:false}); el.addEventListener("touchend",off,{passive:false});
      el.addEventListener("touchcancel",off,{passive:false});
      el.addEventListener("mousedown",on); el.addEventListener("mouseup",off); el.addEventListener("mouseleave",off);
    };
    bind("d-up","U"); bind("d-down","D"); bind("d-left","L"); bind("d-right","R");
    bind("b-a","A"); bind("b-b","B"); bind("b-start","START");
    addEventListener("touchstart",()=>document.body.classList.add("touch"),{once:true,passive:true});
  },
  p(k){ return !!this.pressed[k]; },
  d(k){ return !!this.down[k]; },
  flush(){ this.pressed={}; },
};

/* ---------- text helpers ---------- */
function setFont(size){ ctx.font = `${size||8}px monospace`; ctx.textBaseline="top"; }
function drawText(s,x,y,color="#202028",size=8,shadow){
  setFont(size);
  if(shadow){ ctx.fillStyle=shadow; ctx.fillText(s,x+1,y+1); }
  ctx.fillStyle=color; ctx.fillText(s,x,y);
}
function wrapText(s, maxw, size){
  setFont(size||8);
  const words=String(s).split(" "), lines=[]; let cur="";
  for(const w of words){
    const t=cur?cur+" "+w:w;
    if(ctx.measureText(t).width>maxw && cur){ lines.push(cur); cur=w; } else cur=t;
  }
  if(cur) lines.push(cur);
  return lines;
}
function panel(x,y,w,h,opts={}){
  ctx.fillStyle=opts.border||"#30506a"; ctx.fillRect(x,y,w,h);
  ctx.fillStyle="#fff"; ctx.fillRect(x+1,y+1,w-2,h-2);
  ctx.fillStyle=opts.bg||"#f8f8f0"; ctx.fillRect(x+2,y+2,w-4,h-4);
}

/* ---------- monsters ---------- */
function expForLevel(l){ return l*l*l; }
function makeMon(spId, lv, opts={}){
  const ivs = opts.ivs || Array.from({length:6},()=>Math.floor(Math.random()*32));
  const m = {
    sp: spId, lv, exp: expForLevel(lv), ivs, evs: opts.evs||[0,0,0,0,0,0],
    status:null, sleepTurns:0, moves:[], hp:0, shiny:false,
  };
  const S=SPECIES[spId];
  const learnable = S.mv.filter(e=>e[0]<=lv).map(e=>e[1]);
  m.moves = [...new Set(learnable)].slice(-4).map(id=>({id, pp:MOVES[id].pp}));
  calcStats(m);
  m.hp = m.stats[0];
  return m;
}
function calcStats(m){
  const S=SPECIES[m.sp], b=S.bs;
  const st=[];
  st[0] = Math.floor((2*b[0]+m.ivs[0]+(m.evs[0]>>2))*m.lv/100)+m.lv+10;
  for(let i=1;i<6;i++) st[i]=Math.floor((2*b[i]+m.ivs[i]+(m.evs[i]>>2))*m.lv/100)+5;
  m.stats=st;
  return st;
}
function monName(m){ return m.nick || SPECIES[m.sp].name; }
function ivGrade(iv){ return iv>=29?"S":iv>=23?"A":iv>=16?"B":iv>=8?"C":"D"; }
function healMon(m){ m.hp=m.stats[0]; m.status=null; m.sleepTurns=0; m.moves.forEach(mv=>mv.pp=MOVES[mv.id].pp); }
function addExp(m, amount, G){
  if(m.lv>=100) return [];
  m.exp += amount;
  const events=[];
  while(m.lv<100 && m.exp >= expForLevel(m.lv+1)){
    m.lv++;
    const oldMax=m.stats[0]; calcStats(m); m.hp += m.stats[0]-oldMax;
    events.push({type:"level", lv:m.lv});
    for(const [l,mv] of SPECIES[m.sp].mv){
      if(l===m.lv && !m.moves.some(x=>x.id===mv)) events.push({type:"move", move:mv});
    }
    const ev = SPECIES[m.sp].ev;
    if(ev && m.lv>=ev[1]) events.push({type:"evolve", to:ev[0]});
  }
  return events;
}

/* ---------- dialog scene ---------- */
class Dialog {
  /* items: strings or {text, choices:[..], onChoice(i), cancel:idx} ; done() callback */
  constructor(items, done){
    this.items = items.map(i=>typeof i==="string"?{text:i}:i);
    this.idx=0; this.done=done; this.charN=0; this.choiceIdx=0; this.lines=null;
  }
  enter(){ this.prep(); }
  prep(){
    const it=this.items[this.idx];
    this.lines = wrapText(it.text, 212, 8);
    this.charN=0; this.choiceIdx=0;
  }
  update(){
    const it=this.items[this.idx];
    const total = this.lines.join(" ").length;
    const spd = (Input.d("A")||Input.d("B")||G.speed>1)?3:1;
    if(this.charN<total) this.charN=Math.min(total, this.charN+spd);
    if(it.choices && this.charN>=total){
      if(Input.p("U")||Input.p("L")){ this.choiceIdx=(this.choiceIdx+it.choices.length-1)%it.choices.length; sfx("blip"); }
      if(Input.p("D")||Input.p("R")){ this.choiceIdx=(this.choiceIdx+1)%it.choices.length; sfx("blip"); }
      if(Input.p("A")){ sfx("confirm"); const i=this.choiceIdx; G.pop(); if(it.onChoice) it.onChoice(i); else if(this.done) this.done(i); return; }
      if(Input.p("B") && it.cancel!==undefined){ sfx("cancel"); G.pop(); if(it.onChoice) it.onChoice(it.cancel); else if(this.done) this.done(it.cancel); return; }
      return;
    }
    if(Input.p("A")||Input.p("B")){
      if(this.charN<total){ this.charN=total; return; }
      sfx("blip");
      this.idx++;
      if(this.idx>=this.items.length){ G.pop(); if(this.done) this.done(); }
      else this.prep();
    }
  }
  draw(){
    const it=this.items[this.idx];
    panel(4, SCREEN_H-44, SCREEN_W-8, 40);
    let shown=0;
    for(let i=0;i<this.lines.length && i<3;i++){
      const ln=this.lines[i];
      const take=Math.max(0, Math.min(ln.length, this.charN-shown));
      drawText(ln.slice(0,take), 12, SCREEN_H-36+i*11, "#202028");
      shown+=ln.length+1;
    }
    const total=this.lines.join(" ").length;
    if(this.charN>=total && !it.choices && (G.frame>>4)&1) drawText("▼", SCREEN_W-20, SCREEN_H-14, "#c03028");
    if(it.choices && this.charN>=total){
      const w=86, h=it.choices.length*12+8, x=SCREEN_W-w-6, y=SCREEN_H-46-h;
      panel(x,y,w,h);
      it.choices.forEach((c,i)=>{
        if(i===this.choiceIdx) drawText("▶", x+5, y+5+i*12, "#c03028");
        drawText(c, x+14, y+5+i*12);
      });
    }
  }
}
function say(items, done){ G.push(new Dialog(Array.isArray(items)?items:[items], done)); }
function ask(text, choices, onChoice, cancel){ G.push(new Dialog([{text, choices, onChoice, cancel}])); }

/* ---------- world helpers ---------- */
const mapCache={};
function getMap(id){
  if(mapCache[id]) return mapCache[id];
  const def=MAPS[id];
  const h=def.tiles.length;
  const w=Math.max(...def.tiles.map(r=>r.length));
  const grid=[];
  for(let y=0;y<h;y++){
    grid[y]=[];
    const row=def.tiles[y];
    for(let x=0;x<w;x++) grid[y][x]=row[x]!==undefined?row[x]:(def.outdoor?"T":"#");
  }
  const m={id, def, w, h, grid};
  mapCache[id]=m;
  return m;
}
function tileAt(m,x,y){ if(x<0||y<0||x>=m.w||y>=m.h) return m.def.outdoor?"T":"#"; return G.pl.cut[m.id+":"+x+","+y]?".":m.grid[y][x]; }
function buildingAt(m,x,y){
  for(const b of m.def.buildings){
    if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h) return b;
  }
  return null;
}
function warpAt(m,x,y){
  for(const wp of m.def.warps){
    if(x>=wp.x&&x<wp.x+(wp.w||1)&&y>=wp.y&&y<wp.y+(wp.h||1)) return wp;
  }
  const b=m.def.buildings.find(b=>b.door[0]===x&&b.door[1]===y);
  if(b) return {to:b.to, tx:null, ty:null, door:true};
  return null;
}
function npcAt(m,x,y){
  const W=G.world;
  return W.npcs.find(n=>n.x===x&&n.y===y && !(n.def.despawnFlag&&flag(n.def.despawnFlag)));
}
function trainerAt(m,x,y){
  return G.world.trainers.find(t=>t.x===x&&t.y===y&&!G.pl.defeated[t.def.id]);
}
function isSolid(m,x,y,forPlayer){
  if(x<0||y<0||x>=m.w||y>=m.h) return true;
  const b=buildingAt(m,x,y);
  if(b){ return !(b.door[0]===x&&b.door[1]===y); }
  const t=tileAt(m,x,y);
  if(SOLID_TILES.has(t)) return true;
  if(WATER_TILES.has(t)){
    if(!forPlayer) return true;
    if(!m.def.outdoor) return true;
    return !(G.pl.bag.tideamulet||G.pl.surfing);
  }
  if(npcAt(m,x,y)) return true;
  if(trainerAt(m,x,y)) return true;
  if(forPlayer===false){ /* npcs avoid warps */ const wp=warpAt(m,x,y); if(wp) return true; }
  return false;
}
const DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const BACK={U:"D",D:"U",L:"R",R:"L"};

/* ---------- world scene ---------- */
class World {
  constructor(){
    this.fade=1; this.fadeDir=-1; this.moving=false; this.mx=0; this.my=0; this.step=0;
    this.follow={x:0,y:0,dir:"D",moving:false,mx:0,my:0};
    this.npcs=[]; this.trainers=[]; this.queue=null; this.exTimer=0; this.bang=null;
    this.loadMap(G.pl.map, true);
  }
  loadMap(id, first){
    this.map=getMap(id);
    const d=this.map.def;
    this.npcs=(d.npcs||[]).map(n=>({def:n, x:n.x, y:n.y, dir:n.dir||"D", ox:n.x, oy:n.y, t:Math.random()*120|0, mx:0,my:0,moving:false}));
    this.trainers=(d.trainers||[]).map(t=>({def:t, x:t.x, y:t.y, dir:t.dir||"D", mx:0,my:0,moving:false}));
    this.follow.x=G.pl.x; this.follow.y=G.pl.y; this.follow.moving=false;
    this.fade=1; this.fadeDir=-1;
    if(!WATER_TILES.has(tileAt(this.map,G.pl.x,G.pl.y))) G.pl.surfing=false;
    autosave();
  }
  enter(){}
  warpTo(wp){
    const self=this;
    this.fadeDir=1;
    this.afterFade=()=>{
      G.pl.map=wp.to;
      if(wp.tx!==null&&wp.tx!==undefined){ G.pl.x=wp.tx; G.pl.y=wp.ty; }
      else { // door: spawn one tile above the interior's exit mat
        const im=getMap(wp.to);
        const ex=im.def.warps[0];
        G.pl.x=ex.x; G.pl.y=ex.y-1;
        G.pl.dir="U";
      }
      self.loadMap(wp.to);
      self.runMapScript();
    };
  }
  runMapScript(){
    const s=this.map.def.script;
    if(s==="rival2" && flag("starter") && !flag("rival2")) startRival2();
  }
  tryMove(dir){
    const p=G.pl, m=this.map;
    p.dir=dir;
    const [dx,dy]=DIRS[dir];
    const nx=p.x+dx, ny=p.y+dy;
    const wp=warpAt(m,nx,ny);
    if(wp&&wp.blockFlag&&!flag(wp.blockFlag)){ sfx("bump"); say(wp.blockText||["The way is blocked."]); return; }
    const targetWater=WATER_TILES.has(tileAt(m,nx,ny));
    if(targetWater && m.def.outdoor && !p.surfing){
      if(p.bag.tideamulet){ ask("The water is calm. Surf with the Tide Amulet?",["Yes","No"],i=>{ if(i===0){ p.surfing=true; sfx("confirm"); this.commitMove(nx,ny); } },1); return; }
      sfx("bump"); say("The water looks deep... Something could help you cross it."); return;
    }
    if(isSolid(m,nx,ny,true)){ if(this.step===0) sfx("bump"); return; }
    if(p.surfing && !targetWater && SOLID_TILES.has(tileAt(m,nx,ny))) return;
    this.commitMove(nx,ny);
  }
  commitMove(nx,ny){
    const p=G.pl;
    this.follow.fx=p.x; this.follow.fy=p.y;
    this.prevX=p.x; this.prevY=p.y;
    p.x=nx; p.y=ny;
    this.moving=true; this.mx=0; this.my=0;
    if(p.surfing && !WATER_TILES.has(tileAt(this.map,nx,ny))) this.landAfter=true;
  }
  finishStep(){
    const p=G.pl, m=this.map;
    p.steps++;
    if(this.landAfter){ p.surfing=false; this.landAfter=false; }
    // follower trails
    this.follow.tx=this.prevX; this.follow.ty=this.prevY;
    // warp?
    const wp=warpAt(m,p.x,p.y);
    if(wp&&(!wp.blockFlag||flag(wp.blockFlag))){ this.warpTo(wp); return; }
    // route1 rival ambush
    if(m.id==="route1" && m.def.script==="rival1" && flag("starter") && !flag("rival1") && p.y<=13){ startRival1(); return; }
    // trainer line of sight
    for(const t of this.trainers){
      if(G.pl.defeated[t.def.id]) continue;
      if(this.sees(t,p.x,p.y)){ this.triggerTrainer(t); return; }
    }
    // wild encounter
    const tile=tileAt(m,p.x,p.y);
    const enc=m.def.enc||{};
    let table=null;
    if(ENCOUNTER_TILES.has(tile)&&enc.grass) table=enc.grass;
    else if((tile==="C"||tile===",")&&enc.cave) table=enc.cave;
    else if(WATER_TILES.has(tile)&&p.surfing&&enc.water) table=enc.water;
    if(table && Math.random()<0.14){ startWildBattle(table); return; }
  }
  sees(t,px,py){
    const d=t.def, [dx,dy]=DIRS[t.dir];
    for(let i=1;i<=(d.range||3);i++){
      const x=t.x+dx*i, y=t.y+dy*i;
      if(x===px&&y===py) return true;
      // only opaque things block sight (water does not)
      if(SOLID_TILES.has(tileAt(this.map,x,y))) return false;
      if(buildingAt(this.map,x,y)) return false;
      if(npcAt(this.map,x,y)||trainerAt(this.map,x,y)) return false;
    }
    return false;
  }
  triggerTrainer(t){
    const self=this;
    this.bang={x:t.x,y:t.y-1,t:40};
    sfx("encounter");
    this.queue={type:"trainerApproach", t, timer:46};
  }
  interact(){
    const p=G.pl, m=this.map, [dx,dy]=DIRS[p.dir];
    const fx=p.x+dx, fy=p.y+dy;
    const n=npcAt(m,fx,fy);
    if(n){ this.talkNpc(n); return; }
    const t=this.trainers.find(t=>t.x===fx&&t.y===fy);
    if(t){
      if(G.pl.defeated[t.def.id]) say(t.def.post);
      else { t.dir=BACK[p.dir]; this.startTrainerBattle(t); }
      return;
    }
    const tile=tileAt(m,fx,fy);
    if(tile==="t"){
      if(p.bag.powergauntlet) ask("A small tree blocks the way. Clear it with the Power Gauntlet?",["Yes","No"],i=>{ if(i===0){ sfx("superhit"); G.pl.cut[m.id+":"+fx+","+fy]=true; } },1);
      else say("A scrappy little tree blocks the path. If only you could clear it...");
      return;
    }
    if(WATER_TILES.has(tile)&&!p.surfing&&m.def.outdoor){
      if(p.bag.tideamulet) ask("The water is calm. Surf with the Tide Amulet?",["Yes","No"],i=>{ if(i===0){ p.surfing=true; sfx("confirm"); this.commitMove(fx,fy); } },1);
      else say("The sea sparkles. You'd need something to cross it.");
      return;
    }
  }
  talkNpc(n){
    const d=n.def;
    if(d.spr!=="sign"&&d.spr!=="pc") n.dir=BACK[G.pl.dir];
    if(d.script){ runNpcScript(d); return; }
    say(d.text);
  }
  startTrainerBattle(t){
    say(t.def.pre, ()=>startTrainerFight(t));
  }
  update(){
    this.exTimer++;
    if(this.fadeDir!==0){
      this.fade+=this.fadeDir*0.08;
      if(this.fade>=1&&this.fadeDir>0){ this.fade=1; this.fadeDir=0; if(this.afterFade){const f=this.afterFade; this.afterFade=null; f();} }
      if(this.fade<=0&&this.fadeDir<0){ this.fade=0; this.fadeDir=0; }
      if(this.fadeDir>0) return;
    }
    if(this.bang){ this.bang.t--; if(this.bang.t<=0) this.bang=null; }
    if(this.queue){
      const q=this.queue;
      if(q.type==="trainerApproach"){
        q.timer--;
        if(q.timer<=0){
          // walk trainer adjacent to player
          const t=q.t, [dx,dy]=DIRS[t.dir];
          const wantX=G.pl.x-dx, wantY=G.pl.y-dy;
          if(t.x===wantX&&t.y===wantY||Math.abs(t.x-G.pl.x)+Math.abs(t.y-G.pl.y)<=1){
            G.pl.dir=BACK[t.dir];
            this.queue=null;
            this.startTrainerBattle(t);
          } else {
            t.moving=true;
            t.mx=0; t.my=0; t.nx=t.x+dx; t.ny=t.y+dy;
            q.timer=8;
          }
        }
        if(q.t.moving){
          q.t.mx+=DIRS[q.t.dir][0]*2; q.t.my+=DIRS[q.t.dir][1]*2;
          if(Math.abs(q.t.mx)>=16||Math.abs(q.t.my)>=16){ q.t.x=q.t.nx; q.t.y=q.t.ny; q.t.moving=false; q.t.mx=0; q.t.my=0; }
        }
        return;
      }
    }
    // player movement
    const p=G.pl;
    if(this.moving){
      const spd=(Input.d("RUN")||Input.d("B"))&&!p.surfing?3:2;
      const [dx,dy]=DIRS[p.dir];
      this.mx+=dx*spd; this.my+=dy*spd;
      this.step+=spd;
      // follower animation sync
      if(Math.abs(this.mx)>=16||Math.abs(this.my)>=16){
        this.moving=false; this.mx=0; this.my=0;
        this.finishStep();
      }
    } else {
      this.step=0;
      if(Input.p("A")) { this.interact(); Input.pressed.A=false; }
      else if(Input.p("START")){ sfx("confirm"); G.push(new PauseMenu()); }
      else {
        for(const d of ["U","D","L","R"]) if(Input.d(d)){ this.tryMove(d); break; }
      }
    }
    // npc wander
    for(const n of this.npcs){
      if(n.def.spr==="sign"||n.def.spr==="pc") continue;
      if(n.moving){
        n.mx+=DIRS[n.dir][0]*1; n.my+=DIRS[n.dir][1]*1;
        if(Math.abs(n.mx)>=16||Math.abs(n.my)>=16){ n.x=n.nx; n.y=n.ny; n.moving=false; n.mx=0; n.my=0; }
        continue;
      }
      if(!n.def.wander) continue;
      n.t--;
      if(n.t<=0){
        n.t=80+Math.random()*160|0;
        const dirs=["U","D","L","R"];
        const d=dirs[Math.random()*4|0];
        if(Math.random()<0.4){ n.dir=d; continue; }
        const [dx,dy]=DIRS[d];
        const nx=n.x+dx, ny=n.y+dy;
        if(Math.abs(nx-n.ox)>1||Math.abs(ny-n.oy)>1) continue;
        if(isSolid(this.map,nx,ny,false)) continue;
        if(nx===G.pl.x&&ny===G.pl.y) continue;
        n.dir=d; n.moving=true; n.nx=nx; n.ny=ny; n.mx=0; n.my=0;
      }
    }
  }
  camera(){
    const m=this.map;
    const pxx=G.pl.x*TS+this.mx, pyy=G.pl.y*TS+this.my;
    let cx=pxx-SCREEN_W/2+TS/2, cy=pyy-SCREEN_H/2+TS/2;
    cx=Math.max(0,Math.min(m.w*TS-SCREEN_W,cx));
    cy=Math.max(0,Math.min(m.h*TS-SCREEN_H,cy));
    if(m.w*TS<SCREEN_W) cx=(m.w*TS-SCREEN_W)/2;
    if(m.h*TS<SCREEN_H) cy=(m.h*TS-SCREEN_H)/2;
    return [Math.round(cx),Math.round(cy)];
  }
  draw(){
    const m=this.map, [cx,cy]=this.camera();
    const frame=(this.exTimer>>5)&1;
    ctx.fillStyle = m.def.sky?"#9ad0f0":(m.def.outdoor?"#7ec850":"#181410");
    ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    const x0=Math.floor(cx/TS), y0=Math.floor(cy/TS);
    const atlas=tileAtlas.frames[frame];
    for(let ty=y0; ty<=y0+Math.ceil(SCREEN_H/TS); ty++){
      for(let tx=x0; tx<=x0+Math.ceil(SCREEN_W/TS); tx++){
        if(tx<0||ty<0||tx>=m.w||ty>=m.h) continue;
        const code=tileAt(m,tx,ty);
        const i=tileAtlas.index[code];
        if(i===undefined) continue;
        ctx.drawImage(atlas, i*TS,0,TS,TS, tx*TS-cx, ty*TS-cy, TS,TS);
      }
    }
    // buildings
    for(const b of m.def.buildings) drawBuilding(b, -cx, -cy);
    // collect drawables sorted by y
    const ents=[];
    for(const n of this.npcs){
      if(n.def.despawnFlag&&flag(n.def.despawnFlag)) continue;
      ents.push({y:n.y*TS+n.my, draw:()=>{
        const spr=getCharSprite(n.def.spr, n.dir, n.moving?(((this.exTimer>>3)&1)?1:0):0);
        ctx.drawImage(spr, n.x*TS+n.mx-cx, n.y*TS+n.my-cy-4);
      }});
    }
    for(const t of this.trainers){
      ents.push({y:t.y*TS+t.my, draw:()=>{
        const spr=getCharSprite(t.def.spr, t.dir, t.moving?(((this.exTimer>>3)&1)?1:0):0);
        ctx.drawImage(spr, t.x*TS+t.mx-cx, t.y*TS+t.my-cy-4);
      }});
    }
    // follower
    const fol=G.pl.party.find(mm=>mm.hp>0);
    if(fol && (this.follow.tx!==undefined) && !(this.follow.tx===G.pl.x&&this.follow.ty===G.pl.y) && !G.pl.surfing){
      const fx=this.follow.tx*TS+(this.moving?this.mx*0:0), fy=this.follow.ty*TS;
      // interpolate follower toward its tile when player moving
      let ox=0, oy=0;
      if(this.moving){
        const ddx=G.pl.x-this.prevX, ddy=G.pl.y-this.prevY;
        ox=(this.prevX-this.follow.tx)*this.mxAbs(); oy=(this.prevY-this.follow.ty)*this.myAbs();
      }
      ents.push({y:fy, draw:()=>{
        const spr=getMonSprite(fol.sp,false);
        const fdir=this.followDir();
        const bob=((this.exTimer>>4)&1);
        let dx=this.follow.tx*TS, dy=this.follow.ty*TS;
        if(this.moving){
          const t=(Math.abs(this.mx)+Math.abs(this.my))/16;
          dx+= (this.prevX-this.follow.tx)*TS*t;
          dy+= (this.prevY-this.follow.ty)*TS*t;
        }
        ctx.drawImage(spr, 0,0,64,64, dx-cx+1, dy-cy-2-bob, 14,14);
      }});
    }
    // player
    ents.push({y:G.pl.y*TS+this.my, draw:()=>{
      const wf=this.moving?(((this.step>>3)&1)?1:0):0;
      const px=G.pl.x*TS+this.mx-cx-(this.moving?DIRS[G.pl.dir][0]*16:0)+(this.moving?0:0);
      // draw at interpolated position: pos = tile - remaining
      const ix=G.pl.x*TS - (this.moving?(DIRS[G.pl.dir][0]*(16-Math.abs(this.mx))):0);
      const iy=G.pl.y*TS - (this.moving?(DIRS[G.pl.dir][1]*(16-Math.abs(this.my))):0);
      if(G.pl.surfing){
        ctx.fillStyle="#3868c8"; ctx.beginPath(); ctx.ellipse(ix-cx+8, iy-cy+12, 8, 4, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle="#88c8f0"; ctx.beginPath(); ctx.ellipse(ix-cx+8, iy-cy+11, 7, 3, 0, 0, Math.PI*2); ctx.fill();
      }
      const spr=getCharSprite("player", G.pl.dir, wf);
      ctx.drawImage(spr, ix-cx, iy-cy-(G.pl.surfing?2:4));
    }});
    ents.sort((a,b)=>a.y-b.y);
    for(const e of ents) e.draw();
    // npc fix interpolation (uses n.mx already in draw closure)
    if(this.bang){
      const bx=this.bang.x*TS-cx, by=this.bang.y*TS-cy;
      panel(bx+2,by+2,12,12); drawText("!",bx+6,by+4,"#c03028");
    }
    // rain overlay on rainy maps
    if(m.def.weather==="rain"&&m.def.outdoor){
      ctx.strokeStyle="rgba(180,210,255,0.45)";
      ctx.beginPath();
      for(let i=0;i<28;i++){
        const rx=((i*97+this.exTimer*5)%(SCREEN_W+20))-10, ry=(i*53+this.exTimer*7)%SCREEN_H;
        ctx.moveTo(rx,ry); ctx.lineTo(rx-2,ry+6);
      }
      ctx.stroke();
    }
    if(m.def.dark){
      const px=G.pl.x*TS-cx+8, py=G.pl.y*TS-cy+8;
      const grad=ctx.createRadialGradient(px,py,30,px,py,110);
      grad.addColorStop(0,"rgba(0,0,0,0)"); grad.addColorStop(1,"rgba(0,0,0,0.75)");
      ctx.fillStyle=grad; ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    }
    // location banner
    if(this.exTimer<120){
      const a=this.exTimer<90?1:(120-this.exTimer)/30;
      ctx.globalAlpha=a;
      panel(4,4,m.def.name.length*6+18,16);
      drawText(m.def.name,12,8);
      ctx.globalAlpha=1;
    }
    if(this.fade>0){ ctx.fillStyle=`rgba(0,0,0,${this.fade})`; ctx.fillRect(0,0,SCREEN_W,SCREEN_H); }
  }
  mxAbs(){ return Math.abs(this.mx); }
  myAbs(){ return Math.abs(this.my); }
  followDir(){ return G.pl.dir; }
}

function drawBuilding(b, ox, oy){
  const x=b.x*TS+ox, y=b.y*TS+oy, w=b.w*TS, h=b.h*TS;

/* ============================== BATTLE ============================== */
function stageMult(s){ return s>=0 ? (2+s)/2 : 2/(2-s); }
function accMult(s){ s=Math.max(-6,Math.min(6,s)); return s>=0 ? (3+s)/3 : 3/(3-s); }
function effSpeed(m){
  let s=m.stats[5]*stageMult(m.stages.spe);
  if(m.status==="PAR") s=Math.floor(s/4);
  return s;
}
/* core damage formula — exposed for testing */
function calcDamage(att, def, moveId, weather, forced={}){
  const mv=MOVES[moveId];
  if(!mv.p) return {dmg:0, eff:1, crit:false};
  const phys = mv.c==="P";
  const critChance = mv.fx&&mv.fx.hc ? 1/8 : 1/16;
  const crit = forced.crit!==undefined ? forced.crit : Math.random()<critChance;
  let aStage=att.stages[phys?"atk":"spa"], dStage=def.stages[phys?"def":"spd"];
  if(crit){ aStage=Math.max(0,aStage); dStage=Math.min(0,dStage); }
  let A=att.stats[phys?1:3]*stageMult(aStage);
  let D=def.stats[phys?2:4]*stageMult(dStage);
  if(phys && att.status==="BRN") A*=0.5;
  let pow=mv.p;
  let base=Math.floor(Math.floor(2*att.lv/5+2)*pow*A/D/50)+2;
  if(weather==="rain"){ if(mv.t==="WAT") base*=1.5; if(mv.t==="FIR") base*=0.5; }
  if(weather==="sun"){ if(mv.t==="FIR") base*=1.5; if(mv.t==="WAT") base*=0.5; }
  if(crit) base*=2;
  const stab = SPECIES[att.sp].t.includes(mv.t) ? 1.5 : 1;
  const eff = typeEff(mv.t, SPECIES[def.sp].t);
  const rand = forced.rand!==undefined ? forced.rand : (217+Math.random()*39)/256;
  const dmg = Math.max(eff>0?1:0, Math.floor(base*stab*eff*rand));
  return {dmg, eff, crit};
}
function moveAccuracyCheck(att, def, moveId, weather){
  const mv=MOVES[moveId];
  if(mv.a===0) return true;
  let acc=mv.a;
  if(moveId==="thunder"){ if(weather==="rain") return true; if(weather==="sun") acc=50; }
  const m=accMult(att.stages.acc - def.stages.eva);
  return Math.random()*100 < acc*m;
}
function canStatus(def, st){
  if(def.status) return false;
  const t=SPECIES[def.sp].t;
  if(st==="BRN"&&t.includes("FIR")) return false;
  if(st==="PSN"&&(t.includes("POI")||t.includes("STE"))) return false;
  if(st==="FRZ"&&t.includes("ICE")) return false;
  if(st==="PAR"&&t.includes("ELE")) return false;
  return true;
}
const STATUS_NAMES={PSN:"poisoned",BRN:"burned",PAR:"paralyzed",SLP:"asleep",FRZ:"frozen solid"};
const STATUS_TAG={PSN:["PSN","#a040a0"],BRN:["BRN","#f08030"],PAR:["PAR","#d8b830"],SLP:["SLP","#9090a8"],FRZ:["FRZ","#58b8d8"]};
const STAT_NAMES={atk:"Attack",def:"Defense",spa:"Sp. Atk",spd:"Sp. Def",spe:"Speed",acc:"accuracy",eva:"evasiveness"};

function freshStages(){ return {atk:0,def:0,spa:0,spd:0,spe:0,acc:0,eva:0}; }

function catchCalc(mon, ballMult, forced={}){
  const rate=SPECIES[mon.sp].cr;
  let a=Math.floor((3*mon.stats[0]-2*mon.hp)*rate*ballMult/(3*mon.stats[0]));
  if(mon.status==="SLP"||mon.status==="FRZ") a*=2;
  else if(mon.status) a=Math.floor(a*1.5);
  if(a>=255) return {caught:true, shakes:4};
  const b=Math.floor(1048560/Math.sqrt(Math.sqrt(16711680/a)));
  let shakes=0;
  for(let i=0;i<4;i++){
    const r=forced.rolls?forced.rolls[i]:Math.floor(Math.random()*65536);
    if(r<b) shakes++; else break;
  }
  return {caught:shakes===4, shakes};
}

class Battle {
  constructor(opts){
    this.opts=opts;
    this.trainer=opts.trainer||null;
    this.enemyParty = this.trainer ? this.trainer.team : [opts.wild];
    this.enemyIdx=0;
    this.plIdx = G.pl.party.findIndex(m=>m.hp>0);
    this.weatherSrc = opts.weather||null;     // ambient
    this.weather = opts.weather||null;
    this.weatherTurns = -1;                    // -1 infinite
    this.q=[]; this.phase="intro"; this.timer=0;
    this.menuIdx=0; this.moveIdx=0; this.anim=null;
    this.runAttempts=0; this.participants=new Set();
    this.plOff={x:0,y:0,vis:1}; this.enOff={x:0,y:0,vis:1};
    this.hpShown={pl:0,en:0}; this.expShown=0;
    this.result=null; this.balls=0;
  }
  get pl(){ return G.pl.party[this.plIdx]; }
  get en(){ return this.enemyParty[this.enemyIdx]; }
  enter(){
    const p=this.pl, e=this.en;
    p.stages=freshStages(); e.stages=freshStages();
    this.hpShown.pl=p.hp; this.hpShown.en=e.hp;
    this.expShown=this.expFrac(p);
    G.pl.seen[e.sp]=true;
    this.participants.add(this.plIdx);
    sfx("encounter");
    if(this.trainer) this.q.push({t:"msg",s:this.trainer.name+" wants to battle!"},{t:"msg",s:this.trainer.name+" sent out "+monName(e)+"!"});
    else this.q.push({t:"msg",s:this.opts.legendary?("The air crackles... "+monName(e)+" descends!"):("A wild "+monName(e)+" appeared!")});
    this.q.push({t:"fn",f:()=>{ G.pl.fought[e.sp]=true; }});
    this.q.push({t:"msg",s:"Go! "+monName(p)+"!"});
    if(this.weather) this.q.push({t:"msg",s:weatherStartMsg(this.weather)});
    this.q.push({t:"menu"});
  }
  expFrac(m){
    if(m.lv>=100) return 0;
    const lo=expForLevel(m.lv), hi=expForLevel(m.lv+1);
    return Math.max(0,Math.min(1,(m.exp-lo)/(hi-lo)));
  }
  /* ---------- turn resolution ---------- */
  chooseEnemyMove(){
    const e=this.en, p=this.pl;
    const usable=e.moves.filter(m=>m.pp>0);
    if(!usable.length) return {id:"struggle", pp:1};
    let best=null, bestScore=-1;
    for(const m of usable){
      const mv=MOVES[m.id];
      let score;
      if(mv.c==="T"){
        score=5+Math.random()*e.lv*0.5;
        if(mv.fx&&mv.fx.st&&!canStatus(p,mv.fx.st)) score=1;
        if(mv.fx&&mv.fx.healPct&&e.hp>e.stats[0]*0.6) score=1;
        if(mv.fx&&mv.fx.weather&&this.weather===mv.fx.weather) score=0;
        if(mv.fx&&mv.fx.stat&&mv.fx.statTgt==="self"&&e.hp<e.stats[0]*0.35) score=2;
      } else {
        const r=calcDamage(e,p,m.id,this.weather,{crit:false,rand:0.925});
        score=Math.min(r.dmg,p.hp)*(mv.a===0?1:mv.a/100);
      }
      score*=0.85+Math.random()*0.3;
      if(score>bestScore){ bestScore=score; best=m; }
    }
    return best;
  }
  playerAct(action){
    // action: {kind:"move",m} {kind:"item",id,target} {kind:"switch",idx} {kind:"run"}
    const eMove=this.chooseEnemyMove();
    const order=[];
    if(action.kind==="move"){
      const pPri=MOVES[action.m.id].pri||0, ePri=eMove?(MOVES[eMove.id].pri||0):-9;
      const pFirst = pPri>ePri || (pPri===ePri && (effSpeed(this.pl)>effSpeed(this.en) || (effSpeed(this.pl)===effSpeed(this.en)&&Math.random()<0.5)));
      if(pFirst){ order.push(["pl",action.m]); if(eMove)order.push(["en",eMove]); }
      else { if(eMove)order.push(["en",eMove]); order.push(["pl",action.m]); }
    } else {
      // items/switch/run resolve first, then enemy attacks
      if(action.kind==="item") this.useItemAction(action);
      if(action.kind==="switch") this.switchAction(action.idx);
      if(action.kind==="run"){ if(this.tryRun()) return; }
      if(eMove) order.push(["en",eMove]);
    }
    for(const [side,m] of order) this.q.push({t:"fn",f:()=>this.execMove(side,m)});
    this.q.push({t:"fn",f:()=>this.endTurn()});
    this.q.push({t:"menu"});
  }
  tryRun(){
    if(this.trainer){ this.q.push({t:"msg",s:"No! There's no running from a Trainer battle!"},{t:"menu"}); return false; }
    this.runAttempts++;
    const ps=effSpeed(this.pl), es=Math.max(1,effSpeed(this.en));
    const f=Math.floor(ps*128/es+30*this.runAttempts)%256;
    if(ps>=es||Math.random()*256<f){
      sfx("flee");
      this.q.push({t:"msg",s:"Got away safely!"},{t:"end",result:"ran"});
      return true;
    }
    this.q.push({t:"msg",s:"Can't escape!"});
    return false;
  }
  switchAction(idx){
    const old=this.pl;
    this.q.push({t:"msg",s:monName(old)+", come back!"});
    this.q.push({t:"fn",f:()=>{
      this.plIdx=idx;
      const nm=this.pl;
      nm.stages=freshStages();
      this.participants.add(idx);
      this.hpShown.pl=nm.hp; this.expShown=this.expFrac(nm);
      this.plOff={x:0,y:0,vis:1};
    }});
    this.q.push({t:"msg",s:"Go! "+monName(G.pl.party[idx])+"!"});
  }
  useItemAction(a){
    const it=ITEMS[a.id];
    G.pl.bag[a.id]--; if(G.pl.bag[a.id]<=0) delete G.pl.bag[a.id];
    if(it.kind==="ball"){ this.throwBall(a.id); return; }
    const tgt=a.target!==undefined?G.pl.party[a.target]:this.pl;
    if(it.kind==="heal"){
      const before=tgt.hp; tgt.hp=Math.min(tgt.stats[0],tgt.hp+it.hp);
      this.q.push({t:"fn",f:()=>{ if(tgt===this.pl) {} }},{t:"msg",s:monName(tgt)+" recovered "+(tgt.hp-before)+" HP!"});
      sfx("heal");
    } else if(it.kind==="revive"){
      tgt.hp=Math.floor(tgt.stats[0]/2); tgt.status=null;
      this.q.push({t:"msg",s:monName(tgt)+" was revived!"}); sfx("heal");
    } else if(it.kind==="cure"){
      if(it.st==="ALL"||tgt.status===it.st){ tgt.status=null; this.q.push({t:"msg",s:monName(tgt)+" is cured!"}); sfx("heal"); }
      else this.q.push({t:"msg",s:"It won't have any effect..."});
    }
  }
  throwBall(ballId){
    if(this.trainer){ this.q.push({t:"msg",s:"You can't catch a Trainer's Pokémon!"},{t:"menu"}); return; }
    const it=ITEMS[ballId];
    this.q.push({t:"msg",s:G.pl.name+" threw a "+it.n+"!"});
    this.q.push({t:"anim",kind:"ball",dur:30});
    const res=catchCalc(this.en, it.mult);
    for(let i=0;i<Math.min(res.shakes,3)+(res.caught?0:1)&&i<4;i++){
      if(i<res.shakes||res.caught) this.q.push({t:"anim",kind:"shake",dur:26});
    }
    if(res.caught){
      this.q.push({t:"fn",f:()=>sfx("catch")});
      this.q.push({t:"msg",s:"Gotcha! "+monName(this.en)+" was caught!"});
      this.q.push({t:"fn",f:()=>{
        const m=this.en; m.hp=Math.max(1,m.hp); G.pl.seen[m.sp]=true; G.pl.fought[m.sp]=true;
        if(m.sp===37) setFlag("rayCaught");
        if(G.pl.party.length<6){ G.pl.party.push(m); }
        else { G.pl.box.push(m); this.q.unshift({t:"msg",s:monName(m)+" was sent to the PC Box!"}); }
      }});
      this.q.push({t:"end",result:"caught"});
    } else {
      this.q.push({t:"fn",f:()=>{ this.enOff.vis=1; }});
      this.q.push({t:"msg",s:["Oh no! It broke free!","Aargh! Almost had it!","Shoot! It was so close, too!"][Math.min(res.shakes,2)]});
      const eMove=this.chooseEnemyMove();
      if(eMove) this.q.push({t:"fn",f:()=>this.execMove("en",eMove)});
      this.q.push({t:"fn",f:()=>this.endTurn()});
      this.q.push({t:"menu"});
    }
  }
  execMove(side, mslot){
    const att=side==="pl"?this.pl:this.en;
    const def=side==="pl"?this.en:this.pl;
    if(!att||att.hp<=0||!def||def.hp<=0) return;
    if(att.flinched){ att.flinched=false; this.q.unshift({t:"msg",s:monName(att)+" flinched!"}); return; }
    // status checks
    if(att.status==="SLP"){
      if(att.sleepTurns>0){ att.sleepTurns--; this.q.unshift({t:"msg",s:monName(att)+" is fast asleep."}); return; }
      att.status=null; this.q.unshift({t:"fn",f:()=>this.execMoveBody(side,att,def,mslot)},{t:"msg",s:monName(att)+" woke up!"}); return;
    }
    if(att.status==="FRZ"){
      if(Math.random()<0.2){ att.status=null; this.q.unshift({t:"fn",f:()=>this.execMoveBody(side,att,def,mslot)},{t:"msg",s:monName(att)+" thawed out!"}); }
      else this.q.unshift({t:"msg",s:monName(att)+" is frozen solid!"});
      return;
    }
    if(att.status==="PAR"&&Math.random()<0.25){ this.q.unshift({t:"msg",s:monName(att)+" is paralyzed! It can't move!"}); return; }
    this.execMoveBody(side,att,def,mslot);
  }
  execMoveBody(side,att,def,mslot){
    const mv=MOVES[mslot.id];
    mslot.pp=Math.max(0,mslot.pp-1);
    const steps=[];
    steps.push({t:"msg",s:monName(att)+" used "+mv.n+"!"});
    steps.push({t:"anim",kind:"lunge",side,dur:14});
    if(!moveAccuracyCheck(att,def,mslot.id,this.weather)){
      steps.push({t:"msg",s:side==="pl"?(monName(att)+"'s attack missed!"):("The attack missed!")});
      this.q.unshift(...steps); return;
    }
    if(mv.c!=="T"){
      const r=calcDamage(att,def,mslot.id,this.weather);
      if(r.eff===0){ steps.push({t:"msg",s:"It doesn't affect "+monName(def)+"..."}); this.q.unshift(...steps); return; }
      steps.push({t:"anim",kind:"hit",side:side==="pl"?"en":"pl",dur:16,eff:r.eff});
      const newHp=Math.max(0,def.hp-r.dmg);
      steps.push({t:"fn",f:()=>{ def.hp=newHp; }});
      steps.push({t:"hp",side:side==="pl"?"en":"pl"});
      if(r.crit) steps.push({t:"msg",s:"A critical hit!"});
      if(r.eff>1) steps.push({t:"msg",s:"It's super effective!"});
      if(r.eff<1) steps.push({t:"msg",s:"It's not very effective..."});
      // secondary effects
      const fx=mv.fx;
      if(fx&&newHp>0){
        if(fx.st&&Math.random()*100<(fx.stCh||0)&&canStatus(def,fx.st))
          steps.push({t:"fn",f:()=>{ def.status=fx.st; if(fx.st==="SLP")def.sleepTurns=1+Math.floor(Math.random()*3); }},
                     {t:"msg",s:monName(def)+" is "+STATUS_NAMES[fx.st]+"!"});
        if(fx.flinch&&Math.random()*100<fx.flinch) steps.push({t:"fn",f:()=>{ def.flinched=true; }});
        if(fx.stat&&Math.random()*100<(fx.statCh===undefined?100:fx.statCh)){
          const tgt=fx.statTgt==="self"?att:def;
          steps.push(...this.statChangeSteps(tgt,fx.stat));
        }
      }
      if(fx&&fx.drain){
        const healed=Math.max(1,Math.floor(r.dmg*fx.drain));
        steps.push({t:"fn",f:()=>{ att.hp=Math.min(att.stats[0],att.hp+healed); }},
                   {t:"hp",side},{t:"msg",s:monName(def)+" had its energy drained!"});
      }
      if(def===this.en&&newHp<=0) steps.push({t:"fn",f:()=>this.enemyFainted()});
      if(def===this.pl&&newHp<=0) steps.push({t:"fn",f:()=>this.playerFainted()});
      if(fx&&fx.st&&def.status==="FRZ"&&mv.t==="FIR"){} // handled by thaw chance
    } else {
      const fx=mv.fx||{};
      let did=false;
      if(fx.weather){
        if(this.weather===fx.weather) steps.push({t:"msg",s:"But it failed!"});
        else { steps.push({t:"fn",f:()=>{ this.weather=fx.weather; this.weatherTurns=5; }},{t:"msg",s:weatherStartMsg(fx.weather)}); }
        did=true;
      }
      if(fx.st){
        if(!canStatus(def,fx.st)) steps.push({t:"msg",s:"It doesn't affect "+monName(def)+"..."});
        else steps.push({t:"fn",f:()=>{ def.status=fx.st; if(fx.st==="SLP")def.sleepTurns=1+Math.floor(Math.random()*3); }},
                        {t:"msg",s:monName(def)+" is "+STATUS_NAMES[fx.st]+"!"});
        did=true;
      }
      if(fx.stat){ const tgt=fx.statTgt==="self"?att:def; steps.push(...this.statChangeSteps(tgt,fx.stat)); did=true; }
      if(fx.healPct){
        if(att.hp>=att.stats[0]) steps.push({t:"msg",s:"Its HP is already full!"});
        else steps.push({t:"fn",f:()=>{ att.hp=Math.min(att.stats[0],att.hp+Math.floor(att.stats[0]*fx.healPct)); sfx("heal"); }},
                        {t:"hp",side},{t:"msg",s:monName(att)+" regained health!"});
        did=true;
      }
      if(!did) steps.push({t:"msg",s:"But nothing happened!"});
    }
    this.q.unshift(...steps);
  }
  statChangeSteps(tgt,changes){
    const steps=[];
    for(const k in changes){
      const amt=changes[k];
      steps.push({t:"fn",f:()=>{
        const cur=tgt.stages[k];
        const next=Math.max(-6,Math.min(6,cur+amt));
        tgt._lastStatMsg = next===cur ? (monName(tgt)+"'s "+STAT_NAMES[k]+" won't go "+(amt>0?"higher":"lower")+"!")
          : (monName(tgt)+"'s "+STAT_NAMES[k]+(amt>=2?" rose sharply!":amt===1?" rose!":amt<=-2?" fell harshly!":" fell!"));
        tgt.stages[k]=next;
      }});
      steps.push({t:"msgDyn",f:()=>tgt._lastStatMsg});
    }
    return steps;
  }
  endTurn(){
    const steps=[];
    // weather
    if(this.weather&&this.weatherTurns>0){
      this.weatherTurns--;
      if(this.weatherTurns===0){
        steps.push({t:"fn",f:()=>{ this.weather=this.weatherSrc&&this.weatherSrc!==this.weather?this.weatherSrc:null; if(this.weatherSrc===this.weather&&this.weatherTurns===0)this.weather=this.weatherSrc; }},
                   {t:"msg",s:weatherEndMsg(this.weather)});
        steps.length=0;
        steps.push({t:"fn",f:()=>{ this.weather=null; }},{t:"msg",s:"The weather cleared up."});
      }
    }
    if(this.weather==="sand"){
      for(const side of ["pl","en"]){
        const m=side==="pl"?this.pl:this.en;
        if(!m||m.hp<=0) continue;
        const t=SPECIES[m.sp].t;
        if(t.includes("ROC")||t.includes("GRO")||t.includes("STE")) continue;
        steps.push({t:"fn",f:()=>{ m.hp=Math.max(0,m.hp-Math.max(1,Math.floor(m.stats[0]/16))); }},
                   {t:"hp",side},{t:"msg",s:monName(m)+" is buffeted by the sandstorm!"});
        steps.push({t:"fn",f:()=>{ if(m.hp<=0){ if(m===this.en) this.enemyFainted(); else this.playerFainted(); } }});
      }
    }
    for(const side of ["pl","en"]){
      const m=side==="pl"?this.pl:this.en;
      if(!m||m.hp<=0) continue;
      if(m.status==="PSN"||m.status==="BRN"){
        const frac=m.status==="PSN"?8:16;
        steps.push({t:"fn",f:()=>{ m.hp=Math.max(0,m.hp-Math.max(1,Math.floor(m.stats[0]/frac))); }},
                   {t:"hp",side},{t:"msg",s:monName(m)+(m.status==="PSN"?" is hurt by poison!":" is hurt by its burn!")});
        steps.push({t:"fn",f:()=>{ if(m.hp<=0){ if(m===this.en) this.enemyFainted(); else this.playerFainted(); } }});
      }
      m.flinched=false;
    }
    this.q.unshift(...steps);
  }
  enemyFainted(){
    if(this._enFaintDone===this.en) return; this._enFaintDone=this.en;
    const e=this.en;
    const steps=[];
    steps.push({t:"anim",kind:"faint",side:"en",dur:24});
    steps.push({t:"msg",s:(this.trainer?"Foe ":"Wild ")+monName(e)+" fainted!"});
    // exp
    const base=SPECIES[e.sp].xy;
    const gain=Math.floor(base*e.lv/7*(this.trainer?1.5:1));
    const recipients=[];
    for(let i=0;i<G.pl.party.length;i++){
      const m=G.pl.party[i];
      if(m.hp<=0) continue;
      if(this.participants.has(i)) recipients.push([i,gain]);
      else if(G.pl.options.expShare) recipients.push([i,Math.floor(gain/2)]);
    }
    for(const [i,amt] of recipients){
      const m=G.pl.party[i];
      steps.push({t:"msg",s:monName(m)+" gained "+amt+" EXP. Points!"});
      steps.push({t:"fn",f:()=>{
        // EVs: +2 to the species' best base stat
        const bs=SPECIES[e.sp].bs;
        let bi=0; for(let k=1;k<6;k++) if(bs[k]>bs[bi]) bi=k;
        m.evs[bi]=Math.min(252,m.evs[bi]+2);
        const evs=addExp(m,amt);
        const sub=[];
        for(const ev of evs){
          if(ev.type==="level"){ sub.push({t:"fn",f:()=>{sfx("levelup"); if(m===this.pl){this.hpShown.pl=m.hp;} }},{t:"msg",s:monName(m)+" grew to Lv. "+ev.lv+"!"}); }
          if(ev.type==="move") sub.push({t:"fn",f:()=>this.learnMove(m,ev.move)});
          if(ev.type==="evolve") m.pendingEvolve=ev.to;
        }
        if(m===this.pl) sub.push({t:"exp"});
        this.q.unshift(...sub);
      }});
      if(m===this.pl) steps.push({t:"exp"});
    }
    if(this.enemyIdx<this.enemyParty.length-1){
      steps.push({t:"fn",f:()=>{
        this.enemyIdx++;
        const ne=this.en;
        ne.stages=freshStages();
        this.hpShown.en=ne.hp; this.enOff={x:0,y:0,vis:1};
        G.pl.seen[ne.sp]=true; G.pl.fought[ne.sp]=true;
        this.q.unshift({t:"msg",s:this.trainer.name+" sent out "+monName(ne)+"!"});
      }});
    } else {
      if(this.trainer){
        steps.push({t:"msg",s:G.pl.name+" defeated "+this.trainer.name+"!"});
        if(this.trainer.winText) for(const s of this.trainer.winText) steps.push({t:"msg",s});
        steps.push({t:"fn",f:()=>{ G.pl.money+=this.trainer.money||0; }});
        steps.push({t:"msg",s:G.pl.name+" got $"+(this.trainer.money||0)+" for winning!"});
      }
      steps.push({t:"end",result:"won"});
    }
    // clear any queued actions that assumed battle continues
    this.q=this.q.filter(ev=>ev.t!=="menu"&&ev.t!=="fn"||ev.keep);
    this.q=[];
    this.q.push(...steps);
  }
  playerFainted(){
    const p=this.pl;
    const steps=[];
    steps.push({t:"anim",kind:"faint",side:"pl",dur:24});
    steps.push({t:"msg",s:monName(p)+" fainted!"});
    const alive=G.pl.party.some(m=>m.hp>0);
    if(alive){
      steps.push({t:"fn",f:()=>{ G.push(new PartyScene({pick:true, forced:true, onPick:idx=>{
        this.switchAction(idx);
      }})); }});
    } else {
      steps.push({t:"msg",s:G.pl.name+" is out of usable Pokémon!"});
      if(this.trainer) steps.push({t:"msg",s:this.trainer.loseText||"You lost!"});
      steps.push({t:"msg",s:G.pl.name+" blacked out!"});
      steps.push({t:"end",result:"lost"});
    }
    this.q=[];
    this.q.push(...steps);
  }
  learnMove(m, moveId){
    if(m.moves.some(x=>x.id===moveId)) return;
    if(m.moves.length<4){
      m.moves.push({id:moveId,pp:MOVES[moveId].pp});
      this.q.unshift({t:"msg",s:monName(m)+" learned "+MOVES[moveId].n+"!"});
      return;
    }
    this.q.unshift({t:"fn",f:()=>{
      G.push(new Dialog([{text:monName(m)+" wants to learn "+MOVES[moveId].n+". Forget an old move?",
        choices:[...m.moves.map(x=>MOVES[x.id].n),"Give up"],
        onChoice:i=>{
          if(i<4){ const old=m.moves[i].id; m.moves[i]={id:moveId,pp:MOVES[moveId].pp};
            this.q.unshift({t:"msg",s:"1, 2, and... Poof! "+monName(m)+" forgot "+MOVES[old].n+" and learned "+MOVES[moveId].n+"!"}); }
          else this.q.unshift({t:"msg",s:monName(m)+" did not learn "+MOVES[moveId].n+"."});
        }}]));
    }});
  }
  finish(result){
    this.result=result;
    if(result==="lost"){
      healAllParty();
      const hm=G.pl.lastHeal||{map:"home",x:5,y:4};
      G.pl.money=Math.max(0,Math.floor(G.pl.money/2));
      G.pop();
      G.world=new World();
      G.scenes[0]=G.world;
      G.pl.map=hm.map; G.pl.x=hm.x; G.pl.y=hm.y;
      G.world.loadMap(hm.map);
      say("You scurried to safety...");
      return;
    }
    G.pop();
    // post battle hooks
    const evolvers=G.pl.party.filter(m=>m.pendingEvolve&&m.hp>0);
    const after=()=>{
      if(this.opts.onWin&&result!=="lost") this.opts.onWin(result);
      autosave();
    };
    if(evolvers.length&&result!=="lost"){ G.push(new EvolveScene(evolvers, after)); }
    else after();
  }
  /* ---------- frame loop ---------- */
  update(){
    const sp=G.speed;
    if(Input.p("FF")){ G.speed=G.speed===1?2:1; sfx("blip"); }
    for(let rep=0;rep<sp;rep++) this.step();
  }
  step(){
    this.timer++;
    if(this.anim){
      this.anim.t++;
      const a=this.anim;
      if(a.kind==="lunge"){ const o=a.side==="pl"?this.plOff:this.enOff; o.x=(a.side==="pl"?1:-1)*Math.sin(a.t/a.dur*Math.PI)*8; }
      if(a.kind==="hit"){ const o=a.side==="pl"?this.plOff:this.enOff; o.vis=(a.t>>1)&1?0.3:1; if(a.t===2) sfx(a.eff>1?"superhit":a.eff<1?"weakhit":"hit"); if(a.t===a.dur){o.vis=1;} }
      if(a.kind==="faint"){ const o=a.side==="pl"?this.plOff:this.enOff; o.y=a.t*3; o.vis=Math.max(0,1-a.t/a.dur); if(a.t===1) sfx("faint"); }
      if(a.kind==="ball"){ this.enOff.vis=a.t>a.dur*0.6?0:1; if(a.t===1) sfx("ball"); }
      if(a.kind==="shake"){ this.enOff.vis=0; this.enOff.x=Math.sin(a.t/4)*3; if(a.t===1) sfx("shake"); }
      if(a.t>=a.dur){ if(a.kind==="faint"){const o=a.side==="pl"?this.plOff:this.enOff; o.vis=0; o.y=0;} if(a.kind==="lunge"){const o=a.side==="pl"?this.plOff:this.enOff;o.x=0;} this.anim=null; }
      return;
    }
    // hp drain animations
    const drain=(key,target)=>{
      const cur=this.hpShown[key];
      if(Math.abs(cur-target)<0.5){ this.hpShown[key]=target; return false; }
      this.hpShown[key]+= (target-cur)*0.15 + Math.sign(target-cur)*0.5;
      return true;
    };
    if(this.phase==="hp"){
      const side=this.cur.side;
      const m=side==="pl"?this.pl:this.en;
      if(!drain(side, m?m.hp:0)) this.phase="q";
      return;
    }
    if(this.phase==="exp"){
      const target=this.expFrac(this.pl);
      // if leveled, expShown may be > target: snap through
      if(this.expShown>target+0.02){ this.expShown+=0.03; if(this.expShown>=1) this.expShown=0; return; }
      this.expShown+=(target-this.expShown)*0.2+0.005;
      if(Math.abs(this.expShown-target)<0.02){ this.expShown=target; this.phase="q"; }
      return;
    }
    if(this.phase==="msg"){
      this.msgChar+=((Input.d("A")||Input.d("B"))?3:1.2);
      const full=this.msgLines.join(" ").length;
      if(this.msgChar>=full){
        this.msgWait=(this.msgWait||0)+1;
        if(this.msgWait>26||Input.p("A")||Input.p("B")){ this.msgWait=0; this.phase="q"; }
      }
      return;
    }
    if(this.phase==="menu"){ this.menuInput(); return; }
    if(this.phase==="moves"){ this.movesInput(); return; }
    if(this.phase==="intro"||this.phase==="q"){
      const ev=this.q.shift();
      if(!ev) { this.phase="menu"; this.menuIdx=0; return; }
      this.cur=ev;
      switch(ev.t){
        case "msg": this.showMsg(ev.s); break;
        case "msgDyn": this.showMsg(ev.f()); break;
        case "fn": ev.f(); this.phase="q"; break;
        case "anim": this.anim={kind:ev.kind,side:ev.side,dur:ev.dur,t:0,eff:ev.eff}; this.phase="q"; break;
        case "hp": this.phase="hp"; break;
        case "exp": this.phase="exp"; break;
        case "menu": this.phase="menu"; this.menuIdx=0; break;
        case "end": this.finish(ev.result); break;
      }
      return;
    }
  }
  showMsg(s){ this.msg=s; this.msgLines=wrapText(s,212,8); this.msgChar=0; this.phase="msg"; }
  menuInput(){
    const opts=["FIGHT","BAG","POKéMON","RUN"];
    if(Input.p("L")||Input.p("R")){ this.menuIdx^=1; sfx("blip"); }
    if(Input.p("U")||Input.p("D")){ this.menuIdx^=2; sfx("blip"); }
    if(Input.p("A")){
      sfx("confirm");
      switch(this.menuIdx){
        case 0: this.phase="moves"; this.moveIdx=0; break;
        case 1: G.push(new BagScene({battle:this})); break;
        case 2: G.push(new PartyScene({pick:true, battle:this, onPick:idx=>{ this.playerAct({kind:"switch",idx}); this.phase="q"; }})); break;
        case 3: this.playerAct({kind:"run"}); this.phase="q"; break;
      }
    }
  }
  movesInput(){
    const mvs=this.pl.moves;
    if(mvs.every(m=>m.pp<=0)){
      this.showMsg(monName(this.pl)+" has no PP left! It used Struggle!");
      this.playerAct({kind:"move", m:{id:"struggle", pp:1}});
      this.phase="q";
      return;
    }
    if(Input.p("B")){ this.phase="menu"; sfx("cancel"); return; }
    if(Input.p("L")||Input.p("R")){ this.moveIdx^=1; if(this.moveIdx>=mvs.length)this.moveIdx=0; sfx("blip"); }
    if(Input.p("U")||Input.p("D")){ this.moveIdx^=2; if(this.moveIdx>=mvs.length)this.moveIdx&=1; sfx("blip"); }
    if(Input.p("A")){
      const m=mvs[this.moveIdx];
      if(!m) return;
      if(m.pp<=0){ sfx("bump"); this.showMsg("There's no PP left for this move!"); this.q.unshift({t:"menu"}); return; }
      sfx("confirm");
      this.playerAct({kind:"move",m});
      this.phase="q";
    }
  }
  /* ---------- drawing ---------- */
  draw(){
    const w=this.weather;
    // background
    let top="#a8d8f0", bot="#cfead8";
    if(w==="rain"){ top="#54688c"; bot="#7a90ac"; }
    if(w==="sun"){ top="#ffd890"; bot="#ffeec8"; }
    if(w==="sand"){ top="#d8b878"; bot="#e8d0a0"; }
    if(this.opts.cave){ top="#3a3028"; bot="#5a4a3c"; }
    if(this.opts.sky){ top="#78b8f0"; bot="#d8ecff"; }

/* ---------- battle starters ---------- */
function pickWeighted(table){
  const tot=table.reduce((a,e)=>a+e[3],0);
  let r=Math.random()*tot;
  for(const e of table){ r-=e[3]; if(r<=0) return e; }
  return table[0];
}
function mapBattleOpts(){
  const m=G.world.map.def;
  return {weather:m.weather||null, cave:!m.outdoor&&m.dark, sky:!!m.sky};
}
function startWildBattle(table){
  const e=pickWeighted(table);
  const lv=e[1]+Math.floor(Math.random()*(e[2]-e[1]+1));
  const wild=makeMon(e[0],lv);
  wild.stages=freshStages();
  G.push(new Battle({wild, ...mapBattleOpts()}));
}
function startStaticBattle(spId,lv,opts){
  const wild=makeMon(spId,lv,{ivs:[31,31,31,31,31,31]});
  wild.stages=freshStages();
  G.push(new Battle({wild, legendary:true, ...mapBattleOpts(), ...opts}));
}
function startTrainerFight(t){
  const d=t.def;
  const team=d.team.map(([sp,lv])=>{
    const m=makeMon(sp,lv,{ivs:Array(6).fill(d.leader?25:15)});
    m.stages=freshStages();
    return m;
  });
  G.push(new Battle({
    trainer:{name:d.name, team, money:d.money, winText:d.post, loseText:d.lose},
    ...mapBattleOpts(),
    onWin:res=>{
      if(res!=="won") return;
      G.pl.defeated[d.id]=true;
      if(d.flagOnWin){
        setFlag(d.flagOnWin);
        if(d.flagOnWin==="badge1"){ sfx("badge"); G.pl.bag.stonebadge=1;
          say(["You received the GRANITE BADGE!","Petra: Pokémon holding up to Lv. 25 will obey you now.","Visit my colleague by the Pokémon Center — he has a gift for trail-clearing."]); }
        if(d.flagOnWin==="badge2"){ sfx("badge"); G.pl.bag.tidebadge=1;
          G.push(new WinScene()); say(["You received the TIDAL BADGE!"]); }
        if(d.flagOnWin==="hideoutCleared"){
          say(["Team Ember scattered into the night!","The harbor — and the Gym — are free again.","Somewhere far above, the clouds seem to sigh in relief."]); }
      }
    },
  }));
}

/* ---------- party ---------- */
class PartyScene {
  /* opts: pick (choose a mon), battle, forced (can't cancel), onPick(idx), item (using item from bag) */
  constructor(opts){ this.o=opts||{}; this.idx=0; this.swapFrom=null; }
  update(){
    const party=G.pl.party;
    if(!party.length){ if(Input.p("B")||Input.p("A")){ sfx("cancel"); G.pop(); } return; }
    if(Input.p("B")&&!this.o.forced){ sfx("cancel"); G.pop(); return; }
    if(Input.p("U")){ this.idx=(this.idx+party.length-1)%party.length; sfx("blip"); }
    if(Input.p("D")){ this.idx=(this.idx+1)%party.length; sfx("blip"); }
    if(Input.p("A")){
      sfx("confirm");
      const m=party[this.idx];
      if(this.o.item){
        const idx=this.idx; G.pop();
        this.o.onPick(idx);
        return;
      }
      if(this.o.pick){
        if(m.hp<=0){ say(monName(m)+" is too weak to battle!"); return; }
        if(this.o.battle&&this.idx===this.o.battle.plIdx){ say(monName(m)+" is already out!"); return; }
        const idx=this.idx;
        G.pop();
        this.o.onPick(idx);
        return;
      }
      if(this.swapFrom!==null){
        const t=party[this.swapFrom]; party[this.swapFrom]=party[this.idx]; party[this.idx]=t;
        this.swapFrom=null;
        return;
      }
      ask(monName(m)+": what to do?",["Summary","Switch","Cancel"],i=>{
        if(i===0) G.push(new SummaryScene(m));
        if(i===1){ this.swapFrom=this.idx; }
      },2);
    }
  }
  draw(){
    ctx.fillStyle="#28505a"; ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    drawText(this.o.pick?"Choose a Pokémon.":"POKéMON",8,6,"#fff",8,"#10282e");
    const party=G.pl.party;
    party.forEach((m,i)=>{
      const y=16+i*23;
      panel(6,y,SCREEN_W-12,21,{bg:i===this.idx?"#fdf3d0":"#f8f8f0"});
      if(this.swapFrom===i) { ctx.fillStyle="rgba(80,160,220,0.3)"; ctx.fillRect(7,y+1,SCREEN_W-14,19); }
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(getMonSprite(m.sp,false),0,0,64,64,10,y+2,18,18);
      drawText(monName(m),32,y+3);
      drawText("Lv"+m.lv,32,y+12,"#506070",7);
      const bw=70;
      ctx.fillStyle="#284048"; ctx.fillRect(120,y+5,bw+2,6);
      ctx.fillStyle="#587068"; ctx.fillRect(121,y+6,bw,4);
      const frac=m.hp/m.stats[0];
      ctx.fillStyle=frac>0.5?"#38c048":frac>0.2?"#e8b830":"#e84838";
      ctx.fillRect(121,y+6,Math.round(bw*frac),4);
      drawText(m.hp+"/"+m.stats[0],120,y+12,"#404048",7);
      if(m.status){ const [s,c]=STATUS_TAG[m.status]; ctx.fillStyle=c; ctx.fillRect(196,y+4,22,9); drawText(s,199,y+5,"#fff",7); }
      if(m.hp<=0){ drawText("FNT",196,y+5,"#c03028",7); }
    });
  }

/* ---------- bag ---------- */
class BagScene {
  /* opts: battle (battle ref) */
  constructor(opts){ this.o=opts||{}; this.idx=0; }
  items(){ return Object.keys(G.pl.bag).filter(k=>G.pl.bag[k]>0); }
  update(){
    const items=this.items();
    if(Input.p("B")){ sfx("cancel"); G.pop(); return; }
    if(!items.length) return;
    if(Input.p("U")){ this.idx=(this.idx+items.length-1)%items.length; sfx("blip"); }
    if(Input.p("D")){ this.idx=(this.idx+1)%items.length; sfx("blip"); }
    this.idx=Math.min(this.idx,items.length-1);
    if(Input.p("A")){
      const id=items[this.idx], it=ITEMS[id];
      sfx("confirm");
      if(it.kind==="key"){ say(it.d); return; }
      if(this.o.battle){
        const b=this.o.battle;
        if(it.kind==="ball"){
          G.pop();
          b.playerAct({kind:"item",id});
          b.phase="q";
          return;
        }
        // heal/cure/revive: pick target
        G.push(new PartyScene({item:true,forced:false,onPick:idx=>{
          const tgt=G.pl.party[idx];
          if(it.kind==="revive"&&tgt.hp>0){ say("It would have no effect."); return; }
          if(it.kind!=="revive"&&tgt.hp<=0){ say("It's too weak! Use a Revive."); return; }
          G.pop(); // bag
          b.playerAct({kind:"item",id,target:idx});
          b.phase="q";
        }}));
        return;
      }
      // overworld use
      if(it.kind==="ball"){ say("No wild Pokémon here to throw it at!"); return; }
      G.push(new PartyScene({item:true,onPick:idx=>{
        const tgt=G.pl.party[idx];
        if(it.kind==="heal"){
          if(tgt.hp<=0||tgt.hp>=tgt.stats[0]){ say("It would have no effect."); return; }
          tgt.hp=Math.min(tgt.stats[0],tgt.hp+it.hp);
          G.pl.bag[id]--; if(G.pl.bag[id]<=0)delete G.pl.bag[id];
          sfx("heal"); say(monName(tgt)+" recovered HP!");
        } else if(it.kind==="revive"){
          if(tgt.hp>0){ say("It would have no effect."); return; }
          tgt.hp=Math.floor(tgt.stats[0]/2); tgt.status=null;
          G.pl.bag[id]--; if(G.pl.bag[id]<=0)delete G.pl.bag[id];
          sfx("heal"); say(monName(tgt)+" was revived!");
        } else if(it.kind==="cure"){
          if(!(it.st==="ALL"?tgt.status:tgt.status===it.st)){ say("It would have no effect."); return; }
          tgt.status=null;
          G.pl.bag[id]--; if(G.pl.bag[id]<=0)delete G.pl.bag[id];
          sfx("heal"); say(monName(tgt)+" is cured!");
        }
      }}));
    }
  }
  draw(){
    ctx.fillStyle="#4a5838"; ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    drawText("BAG"+(this.o.battle?" (battle)":""),8,6,"#fff",8,"#222c18");

    items.slice(0,8).forEach((id,i)=>{
      const it=ITEMS[id], y=24+i*12;

      drawText(it.n,22,y);
      drawText("x"+G.pl.bag[id],170,y,"#506070");
      if(it.kind==="key") drawText("KEY",200,y,"#a07820",7);

    panel(6,128,SCREEN_W-12,26);

    if(sel) wrapText(ITEMS[sel].d,SCREEN_W-28,7).slice(0,2).forEach((l,i)=>drawText(l,14,133+i*9,"#404048",7));
  }
}

/* ---------- PC box ---------- */

    if(Input.p("D")&&list.length){ this.idx=(this.idx+1)%list.length; sfx("blip"); }
    if(Input.p("A")&&list.length){
      sfx("confirm");
      const m=list[this.idx];
      if(this.side===0){ // deposit
        if(G.pl.party.filter(x=>x.hp>0).length<=1&&m.hp>0&&G.pl.party.length===1){ say("You can't deposit your last Pokémon!"); return; }
        if(G.pl.party.length<=1){ say("You can't deposit your last Pokémon!"); return; }
        ask("Deposit "+monName(m)+"?",["Yes","No"],i=>{
          if(i===0){ G.pl.party.splice(this.idx,1); G.pl.box.push(m); this.idx=0; }

          if(i===0){ G.pl.box.splice(this.idx,1); G.pl.party.push(m); this.idx=0; }

    }
  }
  draw(){

/* ---------- mart ---------- */
class MartScene {
  constructor(stock){ this.stock=stock; this.idx=0; this.mode=0; this.qty=1; }
  update(){
    if(this.mode===0){
      if(Input.p("B")){ sfx("cancel"); G.pop(); say("Clerk: Come again!"); return; }
      if(Input.p("U")){ this.idx=(this.idx+this.stock.length-1)%this.stock.length; sfx("blip"); }
      if(Input.p("D")){ this.idx=(this.idx+1)%this.stock.length; sfx("blip"); }
      if(Input.p("A")){ sfx("confirm"); this.mode=1; this.qty=1; }
    } else {
      const it=ITEMS[this.stock[this.idx]];
      if(Input.p("B")){ sfx("cancel"); this.mode=0; return; }
      if(Input.p("U")||Input.p("R")) this.qty=Math.min(99,this.qty+1);
      if(Input.p("D")||Input.p("L")) this.qty=Math.max(1,this.qty-1);
      if(Input.p("A")){
        const cost=it.price*this.qty;
        if(cost>G.pl.money){ sfx("bump"); say("Clerk: You don't have enough money!"); }
        else {
          G.pl.money-=cost;
          G.pl.bag[this.stock[this.idx]]=(G.pl.bag[this.stock[this.idx]]||0)+this.qty;
          sfx("confirm"); say("Clerk: Thank you! Anything else?");
        }
        this.mode=0;
      }
    }
  }
  draw(){
    ctx.fillStyle="rgba(8,16,24,0.55)"; ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    panel(14,12,SCREEN_W-28,118);
    drawText("POKé MART",24,18,"#30506a");
    drawText("$"+G.pl.money,170,18,"#406040");
    this.stock.forEach((id,i)=>{
      const it=ITEMS[id], y=32+i*12;
      if(i===this.idx) drawText("▶",22,y,"#c03028");
      drawText(it.n,32,y);
      drawText("$"+it.price,160,y,"#506070");
    });
    panel(14,132,SCREEN_W-28,24);
    const it=ITEMS[this.stock[this.idx]];
    if(this.mode===1){
      drawText("How many? ◀ "+this.qty+" ▶   = $"+(it.price*this.qty),24,140);
    } else {
      wrapText(it.d,SCREEN_W-52,7).slice(0,2).forEach((l,i)=>drawText(l,24,136+i*9,"#404048",7));
    }
  }
}

/* ---------- evolution ---------- */
class EvolveScene {
  constructor(mons,done){ this.mons=mons; this.done=done; this.i=0; this.t=0; this.state="ask"; }
  update(){
    const m=this.mons[this.i];
    if(!m){ G.pop(); if(this.done)this.done(); return; }
    if(this.state==="ask"){
      this.state="anim"; this.t=0;
      sfx("evolve");
    }
    if(this.state==="anim"){
      this.t++;
      if(Input.p("B")&&this.t<140){ // cancel evolution
        sfx("cancel");
        say("Huh? "+monName(m)+" stopped evolving!");
        m.pendingEvolve=null;
        this.i++; this.state="ask";
        return;
      }
      if(this.t>=160){
        const to=m.pendingEvolve;
        const oldName=monName(m);
        const oldMax=m.stats[0];
        m.sp=to; m.pendingEvolve=null; m.nick=m.nick||null;
        calcStats(m); m.hp+=m.stats[0]-oldMax;
        G.pl.seen[to]=true;
        // learn moves at this level for new species
        say(["What? "+oldName+" is evolving!","Congratulations! Your "+oldName+" evolved into "+SPECIES[to].name+"!"]);
        sfx("badge");
        this.i++; this.state="ask";
      }
    }
  }
  draw(){
    const m=this.mons[this.i];
    ctx.fillStyle="#101820"; ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    if(!m) return;
    const t=this.t;
    const flash=t>40&&t<140&&((t>>3)&1);
    const sp=flash&&m.pendingEvolve?m.pendingEvolve:m.sp;
    if(t>40&&t<140){ ctx.fillStyle=`rgba(255,255,255,${0.25+0.2*Math.sin(t/6)})`; ctx.fillRect(0,0,SCREEN_W,SCREEN_H); }
    const sc=1+Math.sin(t/30)*0.05;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(getMonSprite(sp,false), 120-40*sc, 50-40*sc+30, 80*sc, 80*sc);
    drawText(t<40?"What?":"...", 20, 140, "#fff");
    if(t>20&&t<140) drawText("(B to stop)",SCREEN_W-66,6,"#9aa",7);
  }
}
