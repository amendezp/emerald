name: Deploy game to GitHub Pages

# Publishes pokemon-emerald.html as index.html on the gh-pages branch.
# GitHub Pages serves that branch at https://amendezp.github.io/emerald/

on:
  push:
    branches: [claude/pokemon-emerald-html-57lbl8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          mkdir dist
          cp pokemon-emerald.html dist/index.html
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
